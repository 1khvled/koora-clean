<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071f19">
<title>مشاهدة المباراة بث مباشر — كورة لايف</title>
<meta name="description" content="مشاهدة المباراة بث مباشر بجودة عالية وبدون إعلانات مزعجة على كورة لايف.">
<link rel="canonical" href="https://kooraadz.vercel.app/player.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:site_name" content="كورة لايف">
<meta property="og:title" content="مشاهدة المباراة بث مباشر — كورة لايف">
<meta property="og:description" content="بث مباشر بجودة عالية وبدون إعلانات مزعجة.">
<meta property="og:url" content="https://kooraadz.vercel.app/player.html">
<meta property="og:image" content="https://kooraadz.vercel.app/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="كورة لايف">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* KOORA-OWN-v1 player: same pitch-night identity as index. */
:root{
  --night:#071f19; --pitch:#0b3d2e; --grass:#16a34a;
  --paper:#0c1a15; --card:#10251e; --ink:#f2f7f4; --muted:#9db5a8;
  --line:#1e3a30; --live:#e0202e; --gold:#ffb800;
  --radius:14px;
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
  font-variant-numeric:tabular-nums;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
/* header */
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{flex:none;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;
  display:inline-flex;align-items:center;background:var(--card)}
.title{flex:1;min-width:0;text-align:center}
.title strong{display:block;font-size:16px;font-weight:900;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.title small{color:var(--muted);font-size:12px;font-weight:600}
/* stage */
.stage{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;
  aspect-ratio:16/9;border:1px solid var(--line)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.shield{position:absolute;inset:0;pointer-events:none;border:2px solid transparent;
  transition:border-color .2s;z-index:5}
.shield.hit{border-color:var(--gold)}
.click-shield{position:absolute;inset:0;z-index:6;display:flex;align-items:center;
  justify-content:center;background:rgba(4,12,9,.78);cursor:pointer;transition:opacity .25s}
.click-shield.hidden{opacity:0;pointer-events:none}
.click-shield button{font-family:var(--font);background:var(--grass);color:#04120c;border:0;
  padding:14px 26px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;
  min-height:52px;max-width:88vw;box-shadow:0 8px 24px rgba(22,163,74,.4)}
.click-shield small{display:block;margin-top:10px;color:#cfe6d6;font-size:12px;font-weight:600}
/* match card */
.mcard{display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:10px}
.mcard .team{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  min-width:0;text-align:center}
.mcard .team img{width:44px;height:44px;object-fit:contain;flex:none;
  background:#0a1f18;border-radius:10px;padding:4px}
.mcard .team b{font-size:13px;font-weight:800;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .mid{flex:none;text-align:center;min-width:86px}
.mcard .mid .vs{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.mcard .mid .vs.live{color:var(--live)}
.mcard .mid .lg{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .mid .tm{font-size:12px;font-weight:800;margin-top:2px}
/* sources */
.src-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px}
.src-head h2{font-size:14px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
.src-head h2 .n{background:var(--grass);color:#04120c;font-size:12px;font-weight:900;
  border-radius:999px;padding:1px 9px}
.src-head small{color:var(--muted);font-size:12px;font-weight:700}
.servers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.srv{font-family:var(--font);border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:12px;min-height:56px;cursor:pointer;padding:8px 10px;
  display:flex;align-items:center;gap:10px;text-align:start;width:100%;min-width:0} /* min-width:0 keeps long EN titles from stretching the grid */
.srv .num{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;font-weight:900;background:var(--pitch);color:#fff}
.srv .meta{flex:1;min-width:0}
.srv .meta b{display:block;font-size:13px;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.srv .meta span{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.srv .live-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 3px rgba(224,32,46,.18)}
.srv.on{border-color:var(--grass);background:var(--pitch);box-shadow:0 0 0 1px var(--grass)}
.srv.on .num{background:var(--grass);color:#04120c}
.srv.on .meta span{color:#cfe6d6}
.srv.on{position:relative}
.srv.on::after{content:"";position:absolute;inset-inline-end:8px;top:8px;width:9px;
  height:9px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 3px rgba(224,32,46,.18)}
.srv.en .meta b{direction:ltr;unicode-bidi:plaintext}
.srv .enbadge{flex:none;font-size:10px;font-weight:900;background:#1e3a30;color:#9fd3b4;
  border-radius:6px;padding:2px 7px;letter-spacing:.5px}
.srv.on .enbadge{background:var(--gold);color:#231a00}
/* match info (FotMob): stats, lineups, ratings, events */
.minfo{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px}
.minfo h3{font-size:13px;font-weight:900;margin:14px 0 8px;color:var(--ink)}
.minfo h3:first-child{margin-top:0}
.minfo .sub{font-size:11px;color:var(--muted);font-weight:700}
.toprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-padding:8px}
.toprow::-webkit-scrollbar{display:none}
.topchip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 6px;font-size:12px;font-weight:800}
.rpill{flex:none;min-width:34px;text-align:center;font-size:13px;font-weight:900;
  border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.r-hi{background:var(--grass);color:#04120c}
.r-md{background:var(--gold);color:#231a00}
.r-lo{background:var(--live);color:#fff}
.r-na{background:#29423a;color:var(--muted)}
.stat{margin-bottom:8px}
.stat .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px}
.stat .lab small{color:var(--muted)}
.stat .bars{display:flex;height:8px;background:#1e3a30;border-radius:99px;overflow:hidden}
.stat .bars i{display:block;height:100%}
.stat .bars .h{background:var(--grass)}
.stat .bars .a{background:#3b5b4e}
.lu-grid{display:grid;gap:12px}
@media (min-width:640px){.lu-grid{grid-template-columns:1fr 1fr}}
.lu{border:1px solid var(--line);border-radius:12px;padding:10px}
.lu header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lu header img{width:26px;height:26px;object-fit:contain}
.lu header b{font-size:13px;font-weight:900;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lu header .fm{font-size:11px;color:var(--muted);font-weight:700}
.pl{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);
  font-size:13px}
.pl:first-of-type{border-top:0}
.pl .num{flex:none;width:24px;text-align:center;color:var(--muted);font-weight:800;font-size:12px}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl.sub{opacity:.75}
.ev{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);
  font-size:13px}
.ev:first-of-type{border-top:0}
.ev .mn{flex:none;min-width:40px;text-align:center;font-size:12px;font-weight:900;
  background:var(--pitch);color:#fff;border-radius:8px;padding:2px 6px}
.ev .ic{flex:none;width:22px;text-align:center}
.ev .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ev .sc{flex:none;color:var(--muted);font-weight:800;font-size:12px}
.minfo .loading{text-align:center;color:var(--muted);padding:18px 0;font-weight:600;font-size:13px}
/* minfo interactive: sticky tabs, filter chips, player popover */
.minfo-tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--card);padding:8px 0;margin-bottom:10px}
.minfo-tabs button{flex:1;font-family:var(--font);min-height:44px;border:1px solid var(--line);background:var(--pitch);color:#fff;border-radius:10px;font-size:13px;font-weight:900;cursor:pointer;padding:8px 6px}
.minfo-tabs button[aria-selected="true"]{background:var(--grass);color:#04120c;border-color:var(--grass)}
.minfo-pane[hidden]{display:none}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.fchip{font-family:var(--font);min-height:44px;border:1px solid var(--line);background:var(--pitch);color:#fff;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer;padding:8px 14px}
.fchip[aria-pressed="true"]{background:var(--grass);color:#04120c;border-color:var(--grass)}
button.pdot{background:none;border:0;padding:0;font-family:var(--font);cursor:pointer}
button.pdot:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mpop{position:fixed;z-index:60;width:250px;max-width:86vw;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);color:var(--ink);text-align:start}
.mpop .mh{display:flex;gap:8px;align-items:center}
.mpop .mh img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#0b3d2e;flex:none}
.mpop .mh .tt{flex:1;min-width:0}
.mpop .mh b{display:block;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpop .mh small{color:var(--muted);font-size:11px;font-weight:700}
.mpop .mx{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--pitch);color:#fff;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer}
.mpop .me{margin:8px 0 0;font-size:12px;font-weight:700;line-height:2}
.mpop .me div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* FotMob-style score header */
.fm-score{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:12px;text-align:center}
.fm-score .lg{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px}
.fm-score .row{display:flex;align-items:center;gap:8px}
.fm-score .tm{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fm-score .tm img{width:40px;height:40px;object-fit:contain}
.fm-score .tm b{font-size:13px;font-weight:900}
.fm-score .mid{flex:none;min-width:86px}
.fm-score .gl{font-size:26px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums}
.fm-score .st{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.fm-score .scorers{display:flex;justify-content:space-between;gap:8px;margin-top:8px;
  font-size:11px;color:var(--muted);font-weight:700;line-height:1.8}
.fm-score .scorers div{flex:1;min-width:0}
/* FotMob-style pitch */
.pitch{position:relative;border-radius:12px;overflow:hidden;background:#1d7a44;
  background:linear-gradient(180deg,#1e8a4c 0%,#17753f 50%,#1e8a4c 100%);
  aspect-ratio:34/58;border:1px solid var(--line);
  max-width:560px;margin-inline:auto} /* centered column on tablets/desktops */
.pitch .ln{position:absolute;border:0 solid rgba(255,255,255,.55);pointer-events:none}
.pitch .half{left:0;right:0;top:50%;border-top-width:2px}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-width:2px;border-radius:50%}
.pitch .boxT{left:50%;top:0;transform:translateX(-50%);width:52%;height:11%;
  border-width:0 2px 2px 2px}
.pitch .boxB{left:50%;bottom:0;transform:translateX(-50%);width:52%;height:11%;
  border-width:2px 2px 0 2px}
.pitch .teamline{display:flex;align-items:center;gap:6px;position:absolute;left:8px;right:8px;
  background:rgba(0,0,0,.35);border-radius:9px;padding:4px 8px;color:#fff;
  font-size:12px;font-weight:900;z-index:3}
.pitch .teamline.tH{top:6px}
.pitch .teamline.tA{bottom:6px}
.pitch .teamline img{width:20px;height:20px;object-fit:contain}
.pitch .teamline .trate{flex:none;font-size:11px;font-weight:900;background:#ff9e1a;
  color:#231a00;border-radius:7px;padding:1px 7px}
.pitch .teamline .fm2{flex:1;text-align:end;color:#dcefe4;font-size:11px;font-weight:700}
.pdot{position:absolute;transform:translate(-50%,-50%);z-index:2;width:17%;
  display:flex;flex-direction:column;align-items:center}
.pimg{position:relative;width:34px;height:34px;max-width:100%}
.pimg i{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;
  background:#0b3d2e;color:#fff;font-size:13px;font-weight:900;font-style:normal;
  border:2px solid rgba(255,255,255,.85)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);background:#0b3d2e}
.pbadge{position:absolute;top:-7px;inset-inline-end:-9px;z-index:3;font-size:11px;
  font-weight:900;border-radius:8px;padding:1px 6px;color:#fff;
  font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.f-hi{background:#22b45e}
.f-md{background:#ff9e1a}
.f-lo{background:#e0202e}
.f-motm{background:#2f7bff}
.pev{position:absolute;top:-7px;inset-inline-start:-9px;z-index:3;font-size:11px;
  font-weight:900;border-radius:50%;width:20px;height:20px;display:grid;
  place-items:center;background:#e0202e;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pev.card{background:#ffb800;color:#231a00;border-radius:5px}
.pev.goal{background:transparent;box-shadow:none;font-size:15px}
.pname{margin-top:2px;font-size:10px;font-weight:800;color:#fff;text-align:center;
  line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:110%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.pname b{font-weight:900}
.unav{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);font-weight:700}
.unav:first-of-type{border-top:0}
/* small phones: shrink pitch dots so 4-4-2 rows never collide */
@media (max-width:360px){
  .pimg{width:30px;height:30px}
  .pname{font-size:9px}
  .pbadge{font-size:10px;padding:0 5px}
  .pev{width:18px;height:18px;font-size:10px}
  .fm-score .gl{font-size:22px}
}
/* tablets/desktops: roomier cards, wider grids */
@media (min-width:768px){
  .wrap{max-width:1000px;padding:16px 20px calc(24px + env(safe-area-inset-bottom))}
  .minfo{padding:20px}
  .lu-grid{grid-template-columns:1fr 1fr;gap:16px}
  .fm-score .tm b{font-size:15px}
  .pl{font-size:14px}
}
.srv:disabled{opacity:.55;cursor:wait}
.srv.skel{pointer-events:none;border-style:dashed}
.srv.skel .meta b,.srv.skel .meta span{background:#1e3a30;border-radius:6px;color:transparent}
.src-note{font-size:12px;color:var(--muted);font-weight:600;margin:8px 2px 0;line-height:1.7}
@media (max-width:420px){.servers{grid-template-columns:1fr 1fr}}
@media (min-width:640px){.servers{grid-template-columns:repeat(3,1fr)}}
/* controls */
.controls{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;font-family:var(--font);border:0;border-radius:12px;min-height:48px;
  font-size:14px;font-weight:800;cursor:pointer;background:var(--pitch);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.status{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-top:10px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:#000;color:#fff;
  font-size:14px;font-weight:600;border-radius:12px;padding:12px 18px;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;max-width:90vw;
  text-align:center;border:1px solid var(--line)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.click-shield{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="back" href="./index.html">‹ عودة</a>
    <div class="title"><strong id="matchTitle">جاري التحميل…</strong><small>بث نظيف بدون إعلانات</small></div>
    <span style="width:76px;flex:none"></span>
  </div>
  <div class="stage">
    <iframe id="player" title="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      loading="eager" sandbox="allow-same-origin allow-scripts allow-forms allow-presentation"></iframe>
    <div class="shield" id="shield"></div>
    <div class="click-shield" id="clickShield">
      <div style="text-align:center">
        <button id="playBtn">▶ اضغط للمشاهدة</button>
        <small>أول ضغطة تفتح البث فقط — بدون إعلانات</small>
      </div>
    </div>
  </div>
  <div class="mcard" id="matchCard" hidden>
    <div class="team"><img id="homeLogo" alt=""><b id="homeName">—</b></div>
    <div class="mid"><div class="vs" id="matchState">…</div><div class="tm" id="matchTime">—</div><div class="lg" id="matchLeague">—</div></div>
    <div class="team"><img id="awayLogo" alt=""><b id="awayName">—</b></div>
  </div>
  <div class="src-head">
    <h2>📡 مصادر البث <span class="n" id="srvCount" hidden>0</span></h2>
    <small id="srvNow">جاري البحث عن السيرفرات…</small>
  </div>
  <div class="servers" id="servers"></div>
  <p class="src-note" id="srcNote" hidden></p>
  <div class="src-head" id="enHead" hidden>
    <h2>🇬🇧 مصادر إنجليزية <span class="n" id="enCount" hidden>0</span></h2>
    <small>تعليق إنجليزي • VIPBox</small>
  </div>
  <div class="servers" id="enServers" hidden></div>
  <p class="src-note" id="enNote" hidden></p>
  <div class="controls">
    <button class="btn" id="btnFull">⛶ ملء الشاشة</button>
    <button class="btn ghost" id="btnReload">⟳ إعادة تحميل</button>
  </div>
  <div class="status" id="status">محظور: 0</div>
  <section class="minfo" id="minfo" hidden>
    <div class="src-head" style="margin-top:0">
      <h2>📊 بيانات المباراة</h2>
      <small id="minfoSrc">FotMob</small>
    </div>
    <div id="minfoBody"><div class="loading">جاري تحميل التشكيلة والتقييمات…</div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const qs = new URLSearchParams(location.search);
/* SEC/robustness: decodeURIComponent throws on a stray '%' (crafted link) and
   would kill the whole script at load — never let params do that. */
function safeDec(v){
  if (v == null) return '';
  try { return decodeURIComponent(v); } catch { return String(v); }
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const id = qs.get('id') || '';
const href = safeDec(qs.get('href'));
const home = decFull(qs.get('home'));
const away = decFull(qs.get('away'));
const startP = decFull(qs.get('st'));

const iframe = document.getElementById('player');
const shield = document.getElementById('shield');
const clickShield = document.getElementById('clickShield');
const statusEl = document.getElementById('status');
document.getElementById('matchTitle').textContent =
  (home || away) ? `${home} × ${away}` : 'مشاهدة المباراة';
if (home || away) document.title = `مشاهدة ${home} × ${away} بث مباشر — كورة لايف`; // #9

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function workerBase(){
  try { return (localStorage.getItem('koora_worker') || '').trim(); } catch { return ''; }
}

/* ad / telegram popup guard — same policy as before */
const BLOCK_RE = /(popads|popcash|adcash|propeller|exoclick|adsterra|doubleclick|adsco\.re|t\.me|telegram\.me|telegram\.org|tg:\/\/|joinchat|youtube\.com\/((watch|shorts|embed|redirect)|((results|hashtag)\?))|youtu\.be\/)/i;
let blocked = 0, lastCleanSrc = '';
function bumpBlocked(){
  blocked++;
  statusEl.textContent = 'محظور: ' + blocked;
  shield.classList.add('hit');
  setTimeout(() => shield.classList.remove('hit'), 500);
  /* #8 watchdog: 3+ blocks in 15s → auto-advance to next server */
  const now = Date.now();
  blockTimes = blockTimes.filter(t => now - t < 15000);
  blockTimes.push(now);
  if (blockTimes.length >= 3 && serverList.length > 1){
    blockTimes = [];
    goServer(srvIdx + 1, true);
  }
}

/* match header card — filled instantly from URL params, enriched by API.
   Computes its OWN live/ended state (same rules as index) instead of trusting
   the possibly-stale tm param — a match that kicked off after the index
   rendered must not say "لم تبدأ" next to a live player. */
const homeLogo = safeDec(qs.get('hl'));
const awayLogo = safeDec(qs.get('al'));
const leagueP = decFull(qs.get('lg'));
const timeP = decFull(qs.get('tm'));
const offP = decFull(qs.get('so'));
const gtP = decFull(qs.get('gt'));
const shP = decFull(qs.get('sh'));
const saP = decFull(qs.get('sa'));
function dec(s){
  return String(s == null ? '' : s).replace(/&#0?39;/g, '’').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
}
/* Full entity decoder: handles single AND double-encoded input (&amp;#039;),
   named (&apos; &quot; &lt; &gt; &amp; &nbsp;), decimal (&#039; &#38;) and hex
   (&#x27;) entities. Loops until stable (max 3x). ALWAYS decode BEFORE esc(). */
function decFull(s){
  let out = String(s == null ? '' : s), prev = '';
  for (let i = 0; i < 3 && out !== prev; i++){
    prev = out;
    out = out.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
      .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => { const c = parseInt(h, 16); return c > 31 && c < 0x110000 ? String.fromCodePoint(c) : m; })
      .replace(/&#(\d+);/g, (m, n) => { const c = parseInt(n, 10); return c > 31 && c < 0x110000 ? String.fromCodePoint(c) : m; });
  }
  return out;
}
function isLiveP(){
  const s = [offP, gtP, timeP].join(' ');
  return /جارية|مباشر|الشوط|استراحة|1H|2H|HT|LIVE/i.test(s) ||
    (!!String(gtP || '').replace(/\D/g, '') && !isEndedP());
}
function isEndedP(){
  return /انتهت|نهاية|FT|Full/i.test([offP, timeP].join(' '));
}
function paintMatch(h, a, hl, al, lg){
  const card = document.getElementById('matchCard');
  if (!h && !a) return;
  card.hidden = false;
  document.getElementById('homeName').textContent = h || '—';
  document.getElementById('awayName').textContent = a || '—';
  const hi = document.getElementById('homeLogo'), ai = document.getElementById('awayLogo');
  if (hl){ hi.src = hl; hi.style.display = ''; hi.onerror = () => hi.style.display = 'none'; } else hi.style.display = 'none';
  if (al){ ai.src = al; ai.style.display = ''; ai.onerror = () => ai.style.display = 'none'; } else ai.style.display = 'none';
  document.getElementById('matchLeague').textContent = lg || 'بث نظيف بدون إعلانات';
  const stEl = document.getElementById('matchState');
  const tmEl = document.getElementById('matchTime');
  if (isLiveP()){
    stEl.textContent = 'مباشر';
    stEl.classList.add('live');
    tmEl.textContent = (gtP || timeP || '').trim() || '•';
  } else if (isEndedP()){
    stEl.textContent = 'انتهت';
    stEl.classList.remove('live');
    tmEl.textContent = (shP !== '' && saP !== '') ? `${shP} - ${saP}` : (timeP || '').trim();
  } else {
    stEl.textContent = 'لم تبدأ';
    stEl.classList.remove('live');
    tmEl.textContent = (timeP || '').trim();
  }
}
paintMatch(home, away, homeLogo, awayLogo, leagueP);

/* multi-server state — one unified list, two views: Arabic grid + English grid.
   supports new servers[]/enServers[] plus legacy embedUrl/livePage/fallbackUrl
   (startP is defined with the other params above) */
let serverList = [], srvIdx = 0, blockTimes = [];
const serversEl = document.getElementById('servers');
const srvCount = document.getElementById('srvCount');
const srvNow = document.getElementById('srvNow');
const srcNote = document.getElementById('srcNote');
const enHead = document.getElementById('enHead');
const enEl = document.getElementById('enServers');
const enCount = document.getElementById('enCount');
const enNote = document.getElementById('enNote');
function kindTag(s){
  if (!s) return '';
  if (s.kind === 'fallback') return 'احتياطي';
  if (s.kind === 'direct') return 'مباشر';
  if (s.kind === 'live') return 'واجهة كاملة';
  if (s.kind === 'en') return 'إنجليزي';
  return 'سيرفر';
}
function subTag(s){
  // NOTE: keep brand names OUT of button text (only kind + time) — some
  // ad-block cosmetic lists remove page elements that mention stream brands,
  // which once left an EN header with zero visible buttons.
  if (s && s.kind === 'en') return [kindTag(s), s.sub].filter(Boolean).join(' • ');
  return [kindTag(s), s.sub].filter(Boolean).join(' • ');
}
function btnHtml(s, i, on){
  const en = s.kind === 'en';
  // SEC: labels/subs come from upstream scrapes (hd7 tab names, vipbox titles) — decode then escape.
  return `<button class="srv${en ? ' en' : ''}${on ? ' on' : ''}" data-i="${i}"><span class="num">${i + 1}</span><span class="meta"><b>${esc(decFull(s.label)) || ('سيرفر ' + (i + 1))}</b><span>${esc(decFull(subTag(s)))}</span></span>${en ? '<span class="enbadge">EN</span>' : ''}</button>`;
}
function showSkeleton(){
  serversEl.innerHTML = [1, 2, 3].map(i =>
    `<button class="srv skel" disabled><span class="num">${i}</span><span class="meta"><b>…</b><span>جاري البحث…</span></span></button>`
  ).join('');
  enEl.innerHTML = '';
  srvCount.hidden = true;
  enCount.hidden = true;
  srvNow.textContent = 'جاري البحث عن السيرفرات…';
  srcNote.hidden = true;
  enHead.hidden = true; enEl.hidden = true; enNote.hidden = true;
}
function showServersFromList(list, enList){
  // Drop unplayable URLs up-front so counts never include dead servers.
  const dedup = (arr) => (arr || []).filter(s => s && s.url && safeSrc(s.play || s.url)).filter((s, i, a) => a.findIndex(x => x.url === s.url) === i);
  const ar = dedup(list), en = dedup(enList);
  serverList = [...ar, ...en].filter((s, i, a) => a.findIndex(x => x.url === s.url) === i);
  srvIdx = 0;
  if (!ar.length){
    serversEl.innerHTML = `<button class="srv" id="retryBtn"><span class="num">!</span><span class="meta"><b>لا توجد سيرفرات</b><span>اضغط لإعادة المحاولة</span></span></button>`;
    document.getElementById('retryBtn').onclick = () => loadRealPlayer();
    srvCount.hidden = true;
    srvNow.textContent = 'لا يوجد بث متاح حالياً';
  } else {
    srvCount.hidden = false;
    srvCount.textContent = ar.length;
    serversEl.innerHTML = ar.map((s) => btnHtml(s, serverList.indexOf(s), serverList.indexOf(s) === 0)).join('');
    [...serversEl.children].forEach(b => { if (b.id !== 'retryBtn') b.onclick = () => goServer(+b.dataset.i, false); });
  }
  if (en.length){
    // Populate the grid FIRST, reveal the header only after — so a header
    // with no buttons can never be left on screen, whatever happens.
    enEl.innerHTML = en.map((s) => btnHtml(s, serverList.indexOf(s), false)).join('');
    [...enEl.children].forEach(b => b.onclick = () => goServer(+b.dataset.i, false));
    enCount.textContent = en.length;
    enNote.textContent = 'مصادر VIPBox الخاصة بهذه المباراة بتعليق إنجليزي — جرّب Video 2 أو 3 إذا تقطّع الأول.';
    if (enEl.children.length){
      enHead.hidden = false; enEl.hidden = false; enNote.hidden = false;
      enCount.hidden = false;
    } else {
      enHead.hidden = true; enEl.hidden = true; enNote.hidden = true;
    }
  } else {
    enHead.hidden = true; enEl.hidden = true; enNote.hidden = true;
  }
  paintNow();
  if (ar.length){
    const fb = ar.filter(s => s.kind === 'fallback').length;
    const live = ar.length - fb;
    srcNote.hidden = false;
    srcNote.textContent = live > 0
      ? `${live} سيرفر بث مباشر${fb ? ' + صفحة المباراة كاحتياطي' : ''} — إذا تقطّع البث جرّب السيرفر التالي. التبديل التلقائي يعمل عند حجب النوافذ.`
      : 'لا يوجد بث مباشر حالياً — تُعرض صفحة المباراة كحل احتياطي.';
  }
}
function paintNow(){
  const s = serverList[srvIdx];
  srvNow.textContent = s ? `تشاهد الآن: ${s.label || ('سيرفر ' + (srvIdx + 1))} (${srvIdx + 1}/${serverList.length})` : '';
  [...serversEl.children].forEach(b => { if (b.dataset.i !== undefined) b.classList.toggle('on', +b.dataset.i === srvIdx); });
  [...enEl.children].forEach(b => { if (b.dataset.i !== undefined) b.classList.toggle('on', +b.dataset.i === srvIdx); });
}
/* SEC: stream URLs come from third-party scrapes — only http(s) absolute or
   site-relative paths may ever reach the iframe. This kills `javascript:`,
   `data:` and `blob:` URL smuggling at the single choke point (demo branch
   included). Reload reuses lastCleanSrc, which was validated here. */
function safeSrc(u){
  const s = String(u == null ? '' : u).trim();
  if (!s || /[\s<>"]/.test(s)) return '';
  if (/^https?:\/\//i.test(s) || s[0] === '/') return s;
  return '';
}
function goServer(i, auto, _tried){
  if (!serverList.length) return;
  srvIdx = ((i % serverList.length) + serverList.length) % serverList.length;
  const s = serverList[srvIdx];
  let src = safeSrc(s && (s.play || s.url));
  // Never load ad/telegram URLs even if an upstream smuggles one in as a
  // "server" — skip to the next instead of leaving a stale highlight.
  if (src && BLOCK_RE.test(src)) src = '';
  if (!src){
    if ((_tried || 0) >= serverList.length - 1){ toast('لا يوجد سيرفر صالح'); return; }
    goServer(srvIdx + 1, auto, (_tried || 0) + 1);
    return;
  }
  iframe.src = src;
  lastCleanSrc = src;
  paintNow();
  rearmShield();
  if (auto) toast('نحاول سيرفراً آخر…');
}
function rearmShield(){
  clickShield.classList.remove('hidden');
}

async function loadRealPlayer(){
  showSkeleton();
  if (qs.get('demo') === '1' && !href){
    const wb = workerBase();
    const demoSrc = safeSrc(wb
      ? wb.replace(/\/$/, '') + '/?url=' + encodeURIComponent('https://www.romabar.info/albaplayer/bein-9/?serv=0')
      : 'https://www.romabar.info/albaplayer/bein-9/?serv=0');
    if (!demoSrc){ toast('رابط البروكسي المحفوظ غير صالح'); return; }
    iframe.src = demoSrc;
    lastCleanSrc = demoSrc;
    showServersFromList([{ label: 'سيرفر تجريبي', url: demoSrc, kind: 'direct', via: 'demo' }]);
    return;
  }
  // Robust load: 12s timeout + one automatic retry. Previously a hung API
  // left a dead skeleton until the user manually refreshed ("sometimes works
  // sometimes not"). Now the page visibly loads, retries once by itself, and
  // only then offers the manual retry button.
  // In-flight guard: rapid retry taps must not spawn parallel fetches.
  if (loadRealPlayer._busy) return;
  loadRealPlayer._busy = true;
  const failBox = () => {
    loadRealPlayer._busy = false;
    serversEl.innerHTML = `<button class="srv" id="retryBtn"><span class="num">!</span><span class="meta"><b>تعذّر التحميل</b><span>اضغط لإعادة المحاولة</span></span></button>`;
    document.getElementById('retryBtn').onclick = () => loadRealPlayer();
    enEl.innerHTML = '';
    srvCount.hidden = true;
    enHead.hidden = true; enEl.hidden = true; enNote.hidden = true;
    srcNote.hidden = true;
    srvNow.textContent = 'تحقق من الاتصال ثم أعد المحاولة';
    toast('تعذّر تحميل البث — تحقق من الاتصال');
  };
  const fetchApi = async () => {
    const q = new URLSearchParams({ id, href, home, away, start: startP, lg: leagueP });
    for (let attempt = 1; attempt <= 2; attempt++){
      srvNow.textContent = attempt > 1 ? 'إعادة المحاولة…' : 'جاري تحميل البث…';
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 12000);
      try {
        const r = await fetch('/api/player?' + q.toString() + (attempt > 1 ? '&retry=1' : ''), { cache: 'no-store', signal: ctrl.signal });
        if (!r.ok) throw new Error('http ' + r.status);
        return await r.json();
      } catch (e){
        if (attempt === 2) throw e;
      } finally { clearTimeout(to); }
    }
  };
  try {
    const data = await fetchApi();
    if (data && (data.home || data.away)) paintMatch(data.home || home, data.away || away, homeLogo, awayLogo, leagueP);
    let list = [];
    if (data && Array.isArray(data.servers) && data.servers.length) list = data.servers;
    else if (data) {
      if (data.embedUrl) list.push({ label: 'المشغّل الرئيسي', url: data.embedUrl, kind: 'leaf', via: data.via || 'hd7livex' });
      if (data.livePage) list.push({ label: 'سيرفرات بديلة', url: data.livePage, kind: 'live', via: data.via || 'hd7livex' });
      if (data.fallbackUrl) list.push({ label: 'صفحة المباراة (احتياطي)', url: data.fallbackUrl, kind: 'fallback', via: 'fallback' });
    }
    const enList = (data && Array.isArray(data.enServers)) ? data.enServers : [];
    showServersFromList(list, enList);
    // Play from the UNIFIED list (Arabic first, English fallback) — using only
    // the Arabic `list` here left a black player when Arabic was empty but
    // English videos existed.
    if (serverList.length){
      goServer(0, false);
      if (serverList[0].kind === 'fallback') toast('لا يوجد بث مباشر — صفحة المباراة');
    } else {
      toast('لا يوجد بث متاح حالياً');
    }
    loadRealPlayer._busy = false;
  } catch (e){
    failBox();
  }
}

/* first click is absorbed so popups never open */
clickShield.addEventListener('click', () => clickShield.classList.add('hidden'));

/* fullscreen (Safari returns undefined, not a Promise — guard it) */
document.getElementById('btnFull').onclick = () => {
  const st = document.querySelector('.stage');
  try {
    if (document.fullscreenElement){
      const p = document.exitFullscreen();
      if (p && p.catch) p.catch(() => {});
    } else if (st.requestFullscreen){
      const p = st.requestFullscreen();
      if (p && p.catch) p.catch(() => toast('تعذّر ملء الشاشة'));
    } else if (st.webkitRequestFullscreen) st.webkitRequestFullscreen();
    else toast('المتصفح لا يدعم ملء الشاشة');
  } catch { toast('تعذّر ملء الشاشة'); }
};
/* reload (cache-bust, hash-safe via URL API) */
document.getElementById('btnReload').onclick = () => {
  if (!lastCleanSrc) return;
  try {
    const u = new URL(lastCleanSrc, location.origin);
    u.searchParams.set('_', Date.now());
    iframe.src = u.toString();
  } catch {
    iframe.src = lastCleanSrc + (lastCleanSrc.includes('?') ? '&' : '?') + '_=' + Date.now();
  }
  rearmShield();
};

/* popup guard: hijacked navigations snap back to the last clean src */
iframe.addEventListener('load', () => {
  try {
    const src = iframe.src || '';
    if (src !== lastCleanSrc && BLOCK_RE.test(src)){
      bumpBlocked();
      iframe.src = lastCleanSrc;
    } else if (src && !BLOCK_RE.test(src)){
      lastCleanSrc = src;
    }
  } catch {}
});
/* block window.open popups from embeds */
window.open = function(){ bumpBlocked(); return null; };

// #4: register service worker; wire its BLOCKED reports into the counter
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'BLOCKED') bumpBlocked();
  });
}
/* FotMob match info (lineups, ratings, stats, events) — parallel, never blocks streams */
function rCls(r){
  if (r == null || !isFinite(r)) return 'r-na';
  if (r >= 7) return 'r-hi';
  if (r >= 5) return 'r-md';
  return 'r-lo';
}
function rPill(r){
  return `<span class="rpill ${rCls(r)}">${r == null || !isFinite(r) ? '–' : Number(r).toFixed(1)}</span>`;
}
function statNum(v){
  const n = parseFloat(v);
  return isFinite(n) ? n : null;
}
/* FotMob-style helpers: rating tiers, photo dots, pitch placement */
function fCls(r, motm){
  if (motm) return 'f-motm';
  if (r == null || !isFinite(r)) return 'f-md';
  if (r >= 7) return 'f-hi';
  if (r >= 5) return 'f-md';
  return 'f-lo';
}
function photoUrl(pid){
  return pid && /^\d{1,12}$/.test(pid)
    ? 'https://images.fotmob.com/image_resources/playerimages/' + pid + '.png' : '';
}
function initials(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '–';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function clampv(v){
  const n = Number(v);
  if (!isFinite(n)) return null;
  return Math.min(0.97, Math.max(0.03, n));
}
/* minfo interactive (tabs / popover / filters / auto-refresh) — parallel, never blocks streams.
   State lives in JS vars only (no storage). Re-renders touch #minfoBody alone:
   the video iframe and server grid are never touched here. */
let miTab = 'ov';
let miEvFilter = 'all';
let miPeriod = 'All';
let miData = null;
let miTimer = null;
let miByPid = {};
let miEvByPid = {};
let miOpener = null;
/* SEC: upstream logo URLs are untrusted — only https without spaces/quotes/brackets. */
function logoOk(u){
  const s = String(u == null ? '' : u);
  if (/^https:\/\//i.test(s) && !/[\s<>"]/.test(s)) return s;
  return '';
}
function miClearTimer(){
  if (miTimer){ clearInterval(miTimer); miTimer = null; }
}
function miArmTimer(){
  miClearTimer();
  if (miData && miData.started && !miData.finished){
    miTimer = setInterval(() => {
      if (document.hidden) return;

  }
}
async function miFetch(){
  const q = new URLSearchParams({ home, away, start: startP, lg: leagueP });
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch('/api/fotmob?' + q.toString(), { cache: 'no-store', signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(to); }
}
async function loadMatchInfo(){
  const box = document.getElementById('minfo');
  if (!home && !away) return;

    const d = await miFetch();

}
async function miRefresh(){

    const d = await miFetch();
    if (!d || !d.found) return;

    document.getElementById('minfoSrc').textContent = (d.league ? d.league + ' • ' : '') + 'FotMob';
    closeMiPop();
    renderMi();
    if (d.finished) miClearTimer();
  } catch {}
}
function miEvIcon(e){
  if (e.kind === 'goal') return '⚽';
  if (e.kind === 'card') return e.red ? '🟥' : '🟨';
  if (e.kind === 'sub') return '🔄';
  return '•';
}
function renderMi(){
  const box = document.getElementById('minfo'), body = document.getElementById('minfoBody');
  const d = miData;
  if (!d || !body) return false;
  miByPid = {};
  const evts = d.events || [];
  const byPid = {};
  evts.forEach(e => {
    const keys = [];
    if (e.pid) keys.push(e.pid);
    (e.swapPids || []).forEach(pid => { if (keys.indexOf(pid) < 0) keys.push(pid); });
    keys.forEach(pid => {
      if (!byPid[pid]) byPid[pid] = [];
      byPid[pid].push(e);
    });
  });
  miEvByPid = byPid;
  const motmPids = {};
  (d.topPlayers || []).forEach(p => { if (p.motm && p.pid) motmPids[p.pid] = 1; });
  const statusTxt = d.finished ? 'انتهت' : (d.started ? 'جارية الآن' : 'لم تبدأ');
  const scorers = (isHome) => {
    const gs = evts.filter(e => e.kind === 'goal' && !!e.home === !!isHome);
    const byName = new Map();
    gs.forEach(e => {
      const k = e.player || '?';
      if (!byName.has(k)) byName.set(k, []);
      byName.get(k).push(e.min);
    });
    const reds = evts.filter(e => e.kind === 'card' && e.red && !!e.home === !!isHome)
      .map(e => `${esc(decFull(e.player))} ${esc(decFull(e.min))} 🟥`);
    return [...byName].map(([n, mins]) => `⚽ ${esc(decFull(n))} ${mins.map(m => esc(decFull(m))).join(', ')}`).concat(reds).join('<br>') || '—';
  };
  const hLogo = logoOk(d.home && d.home.logo), aLogo = logoOk(d.away && d.away.logo);
  const scoreHtml = `<div class="fm-score"><div class="lg">${esc(decFull(d.league || ''))}</div><div class="row">`
    + `<div class="tm">${hLogo ? `<img src="${esc(hLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}<b>${esc(decFull(d.home.name))}</b></div>`
    + `<div class="mid"><div class="gl">${d.home.score != null ? d.home.score : '–'} - ${d.away.score != null ? d.away.score : '–'}</div><div class="st">${statusTxt}</div></div>`
    + `<div class="tm">${aLogo ? `<img src="${esc(aLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}<b>${esc(decFull(d.away.name))}</b></div>`
    + `</div><div class="scorers"><div>${scorers(true)}</div><div>${scorers(false)}</div></div></div>`;
  // --- clickable pitch dots (button dots; coach has no dot and never pops) ---
  const dot = (p, mirror, homeFlag, teamName, starter) => {
    const x = clampv(p.x), y = clampv(p.y);
    if (x == null || y == null) return '';
    if (p.pid) miByPid[p.pid] = { p, home: !!homeFlag, team: teamName || '', starter: !!starter };
      // Vertical half-pitch per side (FotMob layout): home attacks downward
      // into the top half, away attacks upward into the bottom half.
      // Left flank is shared (no horizontal flip) — verified vs reference.
      // Clamped so edge dots (and their badges) never clip outside the pitch.
      const left = Math.min(91, Math.max(9, 4 + y * 92)).toFixed(1);
      const top = mirror ? (95 - x * 41).toFixed(1) : (5 + x * 41).toFixed(1);
    const motm = p.pid && motmPids[p.pid];
    const pe = (p.pid && byPid[p.pid]) || [];
    const badge = `<span class="pbadge ${fCls(p.rating, motm)}">${p.rating != null && isFinite(p.rating) ? Number(p.rating).toFixed(1) : '–'}${motm ? '★' : ''}</span>`;
    let evb = '';
    const sub = pe.find(e => e.kind === 'sub');
    const card = pe.find(e => e.kind === 'card');
    const goal = pe.find(e => e.kind === 'goal');
    if (sub) evb += `<span class="pev" title="تبديل">${esc(decFull(String(sub.min || '').replace('’', '')))}</span>`;
    else if (card) evb += `<span class="pev card">${card.red ? '🟥' : '🟨'}</span>`;
    else if (goal) evb += `<span class="pev goal">⚽</span>`;
    const photo = photoUrl(p.pid);
    const lbl = esc(decFull(p.short || p.name));
    return `<button type="button" class="pdot" data-pid="${esc(p.pid || '')}" style="left:${left}%;top:${top}%" aria-haspopup="dialog" aria-label="${lbl}">${evb}`
      + `<span class="pimg"><i>${esc(initials(p.short || p.name))}</i>${photo ? `<img src="${photo}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`
      + `${badge}<span class="pname"><b>${esc(decFull(p.num))}</b> ${lbl}</span></button>`;
  };
  const tH = (d.lineups && d.lineups.home) || {}, tA = (d.lineups && d.lineups.away) || {};
  const hasPitch = (tH.starters || []).some(p => p.x != null) || (tA.starters || []).some(p => p.x != null);
  let pitchHtml = '';
  if (hasPitch){
    const tline = (t, logo, cls) =>
      `<div class="teamline ${cls}">${t.rating != null && isFinite(t.rating) ? `<span class="trate">${Number(t.rating).toFixed(1)}</span>` : ''}${logo ? `<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}<span>${esc(decFull(t.name))}</span><span class="fm2">${esc(decFull(t.formation))}</span></div>`;
    pitchHtml = `<div class="pitch"><div class="ln half"></div><div class="ln circ"></div><div class="ln boxT"></div><div class="ln boxB"></div>`
      + tline(tH, hLogo, 'tH')
      + (tH.starters || []).map(p => dot(p, false, true, tH.name, true)).join('')
      + (tA.starters || []).map(p => dot(p, true, false, tA.name, true)).join('')
      + tline(tA, aLogo, 'tA') + `</div>`;
  }
  // Subs registered too (for دخول/خروج labels in the popover).
  (tH.subs || []).forEach(p => { if (p.pid && !miByPid[p.pid]) miByPid[p.pid] = { p, home: true, team: tH.name || '', starter: false }; });
  (tA.subs || []).forEach(p => { if (p.pid && !miByPid[p.pid]) miByPid[p.pid] = { p, home: false, team: tA.name || '', starter: false }; });
  // --- Lists: XI + subs + coach + unavailable ---
  const luSide = (t, logo) => {
    const coach = t.coach ? `<div class="sub">المدرب: ${esc(decFull(t.coach))}</div>` : '';
    const st = (t.starters || []).map(p =>
      `<div class="pl"><span class="num">${esc(decFull(p.num))}</span><span class="nm">${esc(decFull(p.name))}</span>${rPill(p.rating)}</div>`).join('');
    const sb = (t.subs || []).length
      ? `<div class="sub" style="margin-top:6px">البدلاء</div>` + (t.subs || []).map(p =>
        `<div class="pl sub"><span class="num">${esc(decFull(p.num))}</span><span class="nm">${esc(decFull(p.name))}</span>${rPill(p.rating)}</div>`).join('')
      : '';
    const un = (t.unavailable || []).length
      ? `<div class="sub" style="margin-top:6px">الغائبون</div>` + (t.unavailable || []).map(p =>
        `<div class="unav"><span>🚑</span><span class="nm">${esc(decFull(p.name))}${p.reason ? ' <small class="sub">(' + esc(decFull(p.reason)) + ')</small>' : ''}</span></div>`).join('')
      : '';
    return `<div class="lu"><header>${logo ? `<img src="${esc(logo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}<b>${esc(decFull(t.name))}</b><span class="fm">${esc(decFull(t.formation))}${t.rating != null && isFinite(t.rating) ? ' • ' + Number(t.rating).toFixed(1) : ''}</span></header>${coach}${st}${sb}${un}</div>`;
  };
  let listsHtml = '';
  if (d.lineups && (d.lineups.home || d.lineups.away)){
    listsHtml = '<h3>📋 التشكيلة</h3><div class="lu-grid">'
      + luSide(d.lineups.home || {}, hLogo)
      + luSide(d.lineups.away || {}, aLogo) + '</div>';
  }
  let topHtml = '';
  if (d.topPlayers && d.topPlayers.length){
    topHtml = '<h3>⭐ الأعلى تقييماً</h3><div class="toprow" tabindex="0">' + d.topPlayers.map(p =>
      `<span class="topchip">${rPill(p.rating)}<span>${esc(decFull(p.name))}${p.motm ? ' ⭐' : ''}</span></span>`).join('') + '</div>';
  }
  // --- stats + period switcher (client-side swap, fallback = All only) ---
  const per = (d.periods && typeof d.periods === 'object') ? d.periods : null;
  const perKeys = per ? ['All', '1H', '2H'].filter(k => per[k] && per[k].length) : [];
  if (perKeys.length && perKeys.indexOf(miPeriod) < 0) miPeriod = perKeys[0];
  const curStats = (per && per[miPeriod] && per[miPeriod].length) ? per[miPeriod] : (d.stats || []);
  const perName = { All: 'الكل', '1H': 'الشوط الأول', '2H': 'الشوط الثاني' };
  let statsHtml = '';
  if (curStats && curStats.length){
    const perHtml = perKeys.length > 1
      ? `<div class="fchips" role="group" aria-label="الفترة">` + perKeys.map(k =>
        `<button type="button" class="fchip" data-per="${k}" aria-pressed="${k === miPeriod}">${perName[k] || k}</button>`).join('') + `</div>`
      : '';
    statsHtml = '<h3>📈 إحصائيات</h3>' + perHtml + curStats.map(s => {
      const hn = statNum(s.home), an = statNum(s.away);
      let hw = 50, aw = 50;
      if (hn != null && an != null && (hn + an) > 0){ hw = Math.round(hn / (hn + an) * 100); aw = 100 - hw; }
      return `<div class="stat"><div class="lab"><span>${esc(decFull(s.home))}</span><small>${esc(decFull(s.title))}</small><span>${esc(decFull(s.away))}</span></div><div class="bars"><i class="h" style="width:${hw}%"></i><i class="a" style="width:${aw}%"></i></div></div>`;
    }).join('');
  }
  // --- events + filter chips (client-side only, no refetch) ---
  const fDefs = [['all', 'الكل'], ['goal', 'أهداف'], ['card', 'بطاقات'], ['sub', 'تبديلات']];
  let evHtml = '';
  if (evts.length){
    const rows = evts.filter(e => miEvFilter === 'all' || e.kind === miEvFilter);
    evHtml = '<h3>🕐 الأحداث</h3>'
      + `<div class="fchips" role="group" aria-label="تصفية الأحداث">` + fDefs.map(f =>
        `<button type="button" class="fchip" data-f="${f[0]}" aria-pressed="${miEvFilter === f[0]}">${f[1]}</button>`).join('') + `</div>`
      + (rows.length ? rows.map(e =>
        `<div class="ev" data-kind="${e.kind}"><span class="mn">${esc(decFull(e.min))}</span><span class="ic">${miEvIcon(e)}</span><span class="nm">${esc(decFull(e.player))}${e.detail ? ' <small class="sub">(' + esc(decFull(e.detail)) + ')</small>' : ''}</span><span class="sc">${esc(e.score)}</span></div>`
      ).join('') : '<div class="sub">لا توجد أحداث هنا</div>');
  }
  if (!scoreHtml && !topHtml && !statsHtml && !pitchHtml && !listsHtml && !evHtml) return false;
  // --- sticky tabs: نظرة (score+top+stats) / التشكيلة (pitch+lists) / الأحداث ---
  const tabBtn = (id, label) =>
    `<button type="button" role="tab" data-tab="${id}" aria-selected="${miTab === id}">${label}</button>`;
  let h = `<div class="minfo-tabs" role="tablist" aria-label="أقسام بيانات المباراة">`
    + tabBtn('ov', 'نظرة عامة') + tabBtn('lu', 'التشكيلة') + tabBtn('ev', 'الأحداث') + `</div>`;
  h += `<div class="minfo-pane" role="tabpanel" data-pane="ov"${miTab === 'ov' ? '' : ' hidden'}>${scoreHtml}${topHtml}${statsHtml}</div>`;
  h += `<div class="minfo-pane" role="tabpanel" data-pane="lu"${miTab === 'lu' ? '' : ' hidden'}>${pitchHtml}${listsHtml}${(!pitchHtml && !listsHtml) ? '<div class="sub">لا توجد تشكيلة متاحة</div>' : ''}</div>`;
  h += `<div class="minfo-pane" role="tabpanel" data-pane="ev"${miTab === 'ev' ? '' : ' hidden'}>${evHtml || '<div class="sub">لا توجد أحداث متاحة</div>'}</div>`;
  body.innerHTML = h;
  body.querySelectorAll('.minfo-tabs [data-tab]').forEach(b => {
    b.onclick = () => { miTab = b.getAttribute('data-tab'); closeMiPop(); renderMi(); };
  });
  body.querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => { miEvFilter = b.getAttribute('data-f'); closeMiPop(); renderMi(); };
  });
  body.querySelectorAll('[data-per]').forEach(b => {
    b.onclick = () => { miPeriod = b.getAttribute('data-per'); closeMiPop(); renderMi(); };
  });
  body.querySelectorAll('.pdot').forEach(b => {
    b.onclick = (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); openMiPop(b); };
  });
  return true;
}
function closeMiPop(){
  miOpener = null;
  const old = document.getElementById('miPop');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  document.removeEventListener('pointerdown', miOutside, true);
  document.removeEventListener('keydown', miEscDown);
}
function miEscDown(e){
  if (e && e.key === 'Escape') closeMiPop();
}
function miOutside(e){
  const pop = document.getElementById('miPop');
  if (!pop || !e || !e.target) return;
  if (pop === e.target || (pop.contains && pop.contains(e.target))) return;
  if (miOpener && (miOpener === e.target || (miOpener.contains && miOpener.contains(e.target)))) return;
  closeMiPop();
}
function openMiPop(btn){
  const pid = btn.getAttribute('data-pid');
  if (!pid) return;
  const wasOpen = document.getElementById('miPop');
  const wasPid = wasOpen ? wasOpen.getAttribute('data-pid') : null;
  closeMiPop();
  if (wasPid === pid) return;
  const info = miByPid[pid];
  if (!info || !info.p) return;
  const p = info.p;
  const list = miEvByPid[pid] || [];
  const photo = photoUrl(pid);
  const rows = list.map(e => {
    if (e.kind === 'sub') return `<div>🔄 ${esc(decFull(e.min))} (${info.starter ? 'خروج' : 'دخول'})</div>`;
    return `<div>${miEvIcon(e)} ${esc(decFull(e.min))}${e.detail ? ' • ' + esc(decFull(e.detail)) : ''}${e.score ? ' (' + esc(e.score) + ')' : ''}</div>`;
  }).join('');
  const el = document.createElement('div');
  el.className = 'mpop';
  el.id = 'miPop';
  el.setAttribute('role', 'dialog');
  el.setAttribute('data-pid', pid);
  el.innerHTML = `<div class="mh">${photo ? `<img src="${photo}" alt="" loading="lazy" onerror="this.remove()">` : ''}`
    + `<span class="tt"><b>${esc(decFull(p.short || p.name))}</b><small>${esc(decFull(p.num))} • ${esc(decFull(info.team))}</small></span>`
    + `<button type="button" class="mx" aria-label="إغلاق">✕</button></div>`
    + `<div style="margin-top:6px">${rPill(p.rating)}</div>`
    + `<div class="me">${rows || '<div>لا أحداث لهذا اللاعب</div>'}</div>`;
  document.body.appendChild(el);
  const mx = el.querySelector('.mx');
  if (mx) mx.onclick = (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); closeMiPop(); };
  miOpener = btn;
  // Near the dot, clamped inside the viewport (flips above when no room below).
  const r = btn.getBoundingClientRect();
  const W = 250, M = 8;
  let left = r.left + r.width / 2 - W / 2;
  if (left < M) left = M;
  if (left > window.innerWidth - W - M) left = window.innerWidth - W - M;
  if (left < M) left = M;
  el.style.left = left + 'px';
  const estH = 230;
  let top = r.bottom + 8;
  if (top + estH > window.innerHeight) top = r.top - estH - 8;
  if (top < M) top = M;
  el.style.top = top + 'px';
  const rh = el.getBoundingClientRect();
  if (rh.bottom > window.innerHeight - M) el.style.top = Math.max(M, window.innerHeight - rh.height - M) + 'px';
  if (rh.right > window.innerWidth - M) el.style.left = Math.max(M, window.innerWidth - rh.width - M) + 'px';
  document.addEventListener('pointerdown', miOutside, true);
  document.addEventListener('keydown', miEscDown);
}

loadRealPlayer();
loadMatchInfo();

</script>
