<!doctype html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071f19">
<title>Koora Analytics</title>
<style>
:root{--night:#071f19;--pitch:#0b3d2e;--grass:#16a34a;--paper:#f2f5f2;--card:#fff;
  --ink:#141b26;--muted:#64748b;--line:#e2e8f0;--live:#e0202e;--gold:#b45309;--radius:14px;
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 32px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back{flex:none;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;background:var(--card)}
.title{flex:1;text-align:center}
.title strong{display:block;font-size:17px;font-weight:900}
.title small{color:var(--muted);font-size:12px;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0 12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font-family:var(--font);border:0;background:none;padding:9px 16px;min-height:40px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--pitch);color:#fff}
.toolbtn{font-family:var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:40px;font-size:13px;font-weight:800;cursor:pointer}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.card .n{font-size:26px;font-weight:900}
.card .l{font-size:12px;color:var(--muted);font-weight:700}
.card .d{font-size:11px;font-weight:800;margin-top:2px}
.d.up{color:var(--grass)}
.d.down{color:var(--live)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.panel h3{font-size:14px;font-weight:800;margin:0 0 10px;color:var(--pitch)}
canvas{width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
thead th{border-top:0;color:var(--muted);font-size:12px}
td.num,th.num{text-align:right;font-weight:800}
tr.me td{font-weight:800}
.filter{width:100%;font-family:var(--font);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;color:var(--ink)}
.status{text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
@media (min-width:640px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="back" href="./index.html">&#8249;</a>
    <div class="title"><strong>Koora Analytics</strong><small>Views, likes &amp; traffic</small></div>
    <span style="width:76px;flex:none"></span>
  </div>
  <div class="toolbar">
    <div class="seg" id="rangeSeg">
      <button data-r="7">7D</button>
      <button data-r="14" class="on">14D</button>
      <button data-r="30">30D</button>
    </div>
    <button class="toolbtn" id="btnRefresh">Refresh</button>
    <button class="toolbtn" id="btnCsv">Export CSV</button>
  </div>
  <div class="cards">
    <div class="card"><div class="n" id="kToday">–</div><div class="l">Views today</div></div>
    <div class="card"><div class="n" id="kRange">–</div><div class="l" id="kRangeL">Views · 14D</div><div class="d" id="kDelta"></div></div>
    <div class="card"><div class="n" id="kLikes">–</div><div class="l" id="kLikesL">Likes · 14D</div></div>
    <div class="card"><div class="n" id="kMatches">–</div><div class="l">Matches tracked</div></div>
    <div class="card"><div class="n" id="kAvg">–</div><div class="l">Avg views / day</div></div>
    <div class="card"><div class="n" id="kBest" style="font-size:18px">–</div><div class="l">Best day</div></div>
  </div>
  <section class="panel"><h3>Views per day</h3><canvas id="chViews" height="170"></canvas></section>
  <section class="panel"><h3>Likes per day</h3><canvas id="chLikes" height="130"></canvas></section>
  <section class="panel"><h3>Top matches</h3>
    <input class="filter" id="fMatch" type="search" placeholder="Filter matches…">
    <table id="tTop"><thead><tr><th>Match</th><th class="num">Views</th><th class="num">Likes</th></tr></thead><tbody><tr><td>…</td><td></td><td></td></tr></tbody></table>
  </section>
  <section class="panel"><h3>Traffic sources</h3>
    <table id="tRefs"><thead><tr><th>Source</th><th class="num">Visits</th><th class="num">Share</th></tr></thead><tbody><tr><td>…</td><td></td><td></td></tr></tbody></table>
  </section>
  <div class="status" id="admStatus">Loading…</div>
  <div class="foot">Auto-refreshes every 60s · unlisted page, not indexed</div>
</div>
<script>
'use strict';
const SB_URL = 'https://fvuxrevpoildgfpzowpd.supabase.co';
const SB_KEY = 'sb_publishable_Jqwz2YOoFvMlOjWJMt2Iug_IR8pDerC';
let RANGE = 14;
let CACHE = { views: null, likes: null, refs: null, likeCounts: null };
async function sbGet(path){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + path, { signal: ctrl.signal,
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n){ return Number(n || 0).toLocaleString('en-US'); }
function dayStr(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayRange(n){
  const out = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) out.push(dayStr(new Date(now.getTime() - i * 86400000)));
  return out;
}
function drawBars(cv, pairs, color){
  try {
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth || 600, H = parseInt(cv.getAttribute('height'), 10) || 170;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H);
    g.strokeStyle = '#e2e8f0';
    g.lineWidth = 1;
    for (let i = 1; i <= 3; i++){
      const y = 8 + (H - 44) * i / 4;
      g.beginPath(); g.moveTo(8, y); g.lineTo(W - 8, y); g.stroke();
    }
    if (!pairs.length) return;
    const max = Math.max(...pairs.map(p => p[1]), 1);
    const step = (W - 20) / pairs.length;
    const bw = Math.max(3, Math.min(34, step - 8));
    g.textAlign = 'center';
    const showLabel = pairs.length <= 16;
    pairs.forEach((p, i) => {
      const h = Math.max(3, (H - 44) * p[1] / max);
      const x = 10 + step * i + (step - bw) / 2, y = H - 26 - h;
      g.fillStyle = (i === pairs.length - 1) ? (color || '#16a34a') : '#0b3d2e';
      g.beginPath();
      if (g.roundRect) g.roundRect(x, y, bw, h, 4); else g.rect(x, y, bw, h);
      g.fill();
      if (showLabel || p[1] === max){
        g.fillStyle = '#141b26';
        g.font = '800 12px Cairo, sans-serif';
        g.fillText(String(p[1]), x + bw / 2, y - 5);
      }
      g.fillStyle = '#64748b';
      g.font = '700 10px Cairo, sans-serif';
      g.fillText(String(p[0]).slice(5), x + bw / 2, H - 10);
    });
  } catch {}
}
function sumBy(rows, kfn, vfn){
  const m = new Map();
  for (const r of rows || []) m.set(kfn(r), (m.get(kfn(r)) || 0) + vfn(r));
  return m;
}
async function fetchAll(){
  const now = new Date();
  const d60 = dayStr(new Date(now.getTime() - 59 * 86400000));
  const d60t = d60 + 'T00:00:00';
  const [views, likeRows, refs, likeCounts] = await Promise.all([
    sbGet('koora_views?select=match_id,day,views&day=gte.' + d60 + '&order=day&limit=5000'),
    sbGet('koora_likes?select=created_at&created_at=gte.' + d60t + '&limit=5000'),
    sbGet('koora_refs?select=day,ref_host,hits&day=gte.' + d60 + '&order=hits.desc&limit=500'),
    sbGet('koora_like_counts?select=match_id,likes&order=likes.desc&limit=50')
  ]);
  if (!views || !likeRows || !refs || !likeCounts) throw new Error('api');
  CACHE = { views, likes: likeRows, refs, likeCounts };
}
function render(){
  const days = dayRange(RANGE);
  const d0 = days[0];
  const inR = r => (r.day || '').slice(0, 10) >= d0;
  const views = (CACHE.views || []).filter(inR);
  const refs = (CACHE.refs || []).filter(inR);
  const likes = (CACHE.likes || []).filter(l => (l.created_at || '').slice(0, 10) >= d0);
  const today = dayStr(new Date());
  // KPI cards
  let tot = 0, totToday = 0;
  const byDay = new Map(), byMatch = new Map();
  for (const v of views){
    tot += v.views;
    byDay.set(v.day, (byDay.get(v.day) || 0) + v.views);
    if (v.match_id !== '__index') byMatch.set(v.match_id, (byMatch.get(v.match_id) || 0) + v.views);
    if (v.day === today) totToday += v.views;
  }
  // previous equal period (from the 60d cache, not refetched)
  const prevDays = new Set();
  for (let i = RANGE; i < RANGE * 2; i++){
    const d = new Date(Date.now() - i * 86400000);
    prevDays.add(dayStr(d));
  }
  let prevTot = 0;
  for (const v of (CACHE.views || [])) if (prevDays.has(v.day)) prevTot += v.views;
  let deltaTxt = '', deltaCls = '';
  if (prevTot > 0){
    const pct = Math.round((tot - prevTot) / prevTot * 100);
    deltaTxt = (pct >= 0 ? '+' : '') + pct + '% vs prior ' + RANGE + 'd';
    deltaCls = pct >= 0 ? 'up' : 'down';
  }
  const likeMap = new Map((CACHE.likeCounts || []).map(l => [l.match_id, l.likes]));
  let totLikes = 0;
  const likeDay = new Map();
  for (const l of likes){
    const d = (l.created_at || '').slice(0, 10);
    likeDay.set(d, (likeDay.get(d) || 0) + 1);
  }
  for (const n of likeMap.values()) totLikes += n;
  let best = null;
  for (const d of days) if (!best || (byDay.get(d) || 0) > best[1]) best = [d, byDay.get(d) || 0];
  document.getElementById('kToday').textContent = fmt(totToday);
  document.getElementById('kRange').textContent = fmt(tot);
  document.getElementById('kRangeL').textContent = 'Views · ' + RANGE + 'D';
  const kd = document.getElementById('kDelta');
  kd.textContent = deltaTxt; kd.className = 'd ' + deltaCls;
  document.getElementById('kLikes').textContent = fmt(likes.length);
  document.getElementById('kLikesL').textContent = 'Likes · ' + RANGE + 'D';
  document.getElementById('kMatches').textContent = fmt(byMatch.size);
  document.getElementById('kAvg').textContent = fmt(Math.round(tot / RANGE));
  document.getElementById('kBest').textContent = best && best[1] ? best[0].slice(5) + ' · ' + fmt(best[1]) : '–';
  drawBars(document.getElementById('chViews'), days.map(d => [d, byDay.get(d) || 0]));
  drawBars(document.getElementById('chLikes'), days.map(d => [d, likeDay.get(d) || 0]), '#b45309');
  // top matches (+ filter)
  const q = (document.getElementById('fMatch').value || '').trim().toLowerCase();
  const top = [...byMatch.entries()].sort((a, b) => b[1] - a[1])
    .filter(([m]) => !q || m.toLowerCase().includes(q)).slice(0, 15);
  document.querySelector('#tTop tbody').innerHTML = top.length
    ? top.map(([m, v]) => `<tr><td>${esc(m)}</td><td class="num">${fmt(v)}</td><td class="num">${likeMap.get(m) != null ? likeMap.get(m) : ''}</td></tr>`).join('')
    : '<tr><td>–</td><td></td><td></td></tr>';
  // refs
  const byRef = sumBy(refs, r => r.ref_host, r => r.hits);
  const rtop = [...byRef.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
  const rtot = rtop.reduce((a, [, n]) => a + n, 0) || 1;
  document.querySelector('#tRefs tbody').innerHTML = rtop.length
    ? rtop.map(([h, n]) => `<tr><td>${esc(h)}</td><td class="num">${fmt(n)}</td><td class="num">${Math.round(n / rtot * 100)}%</td></tr>`).join('')
    : '<tr><td>–</td><td></td><td></td></tr>';
  try { document.getElementById('admStatus').textContent = 'Updated ' + new Date().toLocaleTimeString(); } catch {}
}
async function loadAdmin(){
  const st = document.getElementById('admStatus');
  try { st.textContent = 'Loading…'; } catch {}
  try {
    await fetchAll();
    render();
  } catch {
    try { st.textContent = 'Failed to load'; } catch {}
  }
}
function toCsv(){
  try {
    const rows = [['day', 'match_id', 'views']];
    for (const v of (CACHE.views || [])) rows.push([v.day, v.match_id, v.views]);
    const csv = rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'koora-views.csv';
    document.body.appendChild(a); a.click(); a.remove();
  } catch {}
}
document.querySelectorAll('#rangeSeg button').forEach(b => b.onclick = () => {
  RANGE = +b.dataset.r || 14;
  document.querySelectorAll('#rangeSeg button').forEach(x => x.classList.toggle('on', x === b));
  try { render(); } catch {}
});
document.getElementById('btnRefresh').onclick = () => loadAdmin();
document.getElementById('btnCsv').onclick = () => toCsv();
document.getElementById('fMatch').addEventListener('input', () => { try { render(); } catch {} });
loadAdmin();
setInterval(() => { if (!document.hidden) loadAdmin(); }, 60000);
</script>
</body>
</html>
