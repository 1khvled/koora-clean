<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071f19">
<title>كورة لايف — مباريات اليوم بث مباشر بدون إعلانات</title>
<meta name="description" content="مباريات اليوم بث مباشر بجودة عالية وبدون إعلانات مزعجة. جدول المباريات، النتائج المباشرة، والقنوات الناقلة.">

<meta property="og:type" content="website">

<meta property="og:site_name" content="كورة لايف">
<meta property="og:title" content="كورة لايف — مباريات اليوم بث مباشر">
<meta property="og:description" content="مباريات اليوم بث مباشر بجودة عالية وبدون إعلانات مزعجة.">
<meta property="og:url" content="https://kooraadz.vercel.app/index.html">
<meta property="og:image" content="https://kooraadz.vercel.app/icon-512.png">

<meta name="twitter:title" content="كورة لايف — مباريات اليوم بث مباشر">
<meta name="twitter:description" content="مباريات اليوم بث مباشر بجودة عالية وبدون إعلانات مزعجة.">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
/* KOORA-OWN-v1: our own pitch-night design. No theme classes, no maroon. */
:root{
  --night:#071f19; --pitch:#0b3d2e; --grass:#16a34a;
  --paper:#f2f5f2; --card:#ffffff; --ink:#131a15; --muted:#5f6f65;
  --line:#e2e9e4; --live:#e0202e; --gold:#ffb800;
  --radius:16px; --shadow:0 1px 3px rgba(7,31,25,.10);
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
/* ── top bar ─────────────────────────────── */
.topbar{background:linear-gradient(160deg,var(--night),var(--pitch));
  color:#fff;padding:14px 16px calc(14px + 22px);position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;left:50%;top:-70px;width:220px;height:220px;
  border:2px solid rgba(255,255,255,.10);border-radius:50%;transform:translateX(-50%);
  pointer-events:none} /* center-circle motif */
.topbar::before{content:"";position:absolute;left:0;right:0;top:50px;height:2px;
  background:rgba(255,255,255,.07);pointer-events:none} /* halfway line */
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand .ball{width:42px;height:42px;border-radius:50%;background:var(--grass);
  display:grid;place-items:center;font-size:22px;flex:none}
.brand strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.brand small{display:block;color:#bfe3cf;font-size:12px;font-weight:600}
/* day segmented control — overlaps header bottom edge */
.days{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;
  margin:-22px 16px 0;position:relative;z-index:2;box-shadow:var(--shadow);
  border:1px solid var(--line)}
.days button{flex:1;border:0;background:transparent;font-family:var(--font);
  font-size:15px;font-weight:700;color:var(--muted);border-radius:10px;
  min-height:44px;cursor:pointer}
.days button.on{background:var(--pitch);color:#fff}
/* ── toolbar ─────────────────────────────── */
.toolbar{padding:12px 16px 0;display:grid;gap:10px}
#searchInput{width:100%;font-family:var(--font);font-size:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#searchInput:focus{outline:2px solid var(--grass);outline-offset:0;border-color:var(--grass)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:700;border-radius:999px;
  padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
/* ── content ─────────────────────────────── */
main{padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:14px 2px 10px}
.sec-title .count{background:var(--live);color:#fff;font-size:12px;font-weight:800;
  border-radius:999px;padding:2px 10px}
/* live rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(78vw,340px);gap:12px;
  overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.live-card{scroll-snap-align:start;background:var(--night);color:#fff;border-radius:var(--radius);
  padding:14px;text-decoration:none;display:block;position:relative;overflow:hidden;
  border-inline-start:4px solid var(--grass)} /* touchline edge */
.live-card .lg{font-size:12px;color:#9fd3b4;font-weight:600;margin-bottom:8px}
.live-card .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.live-card .row img{width:26px;height:26px;object-fit:contain;flex:none}
.live-card .row b{margin-inline-start:auto;font-size:18px;font-weight:900}
.live-card .score-line{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.live-card .vs{font-size:22px;font-weight:900;letter-spacing:1px}
.minute{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#231a00;
  font-weight:900;font-size:14px;border-radius:999px;padding:4px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;
  animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* league groups */
.league{margin-top:18px}
.league > h3{font-size:14px;font-weight:800;color:var(--pitch);margin:0 2px 8px;
  display:flex;align-items:center;gap:8px}
.league > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.m{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;text-decoration:none;
  color:var(--ink);box-shadow:var(--shadow);min-height:64px}
.m .st{flex:none;width:58px;text-align:center}
.m .st .t{font-weight:800;font-size:14px}
.m .st .s{font-size:11px;font-weight:700;color:var(--muted)}
.m .st .s.live{color:var(--live)}
.m .teams{flex:1;display:grid;gap:6px;min-width:0}
.m .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.m .t img{width:24px;height:24px;object-fit:contain;flex:none}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .t b{margin-inline-start:auto;font-weight:900;font-size:16px;flex:none}
.m .go{flex:none;color:var(--muted);font-size:18px}
.m.is-live{border-inline-start:4px solid var(--live)}
#empty{text-align:center;color:var(--muted);padding:40px 0;font-weight:600}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;
  font-size:14px;font-weight:600;border-radius:12px;padding:12px 18px;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;max-width:90vw;
  text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
@media (min-width:700px){.rail{grid-auto-columns:340px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="ball">⚽</span>
    <div><strong>كورة لايف</strong><small>بث نظيف بدون إعلانات</small></div>
  </div>
</header>
<nav class="days" id="dayTabs" aria-label="اختر اليوم">
  <button data-day="yesterday">أمس</button>
  <button data-day="today" class="on">اليوم</button>
  <button data-day="tomorrow">الغد</button>
</nav>
<div class="toolbar">
  <input id="searchInput" type="search" placeholder="ابحث عن فريق أو بطولة…" autocomplete="off">
  <div class="chips" id="leagueChips"></div>
</div>
<main id="content">
  <div class="loading" id="loading">جاري تحميل المباريات…</div>
  <section id="liveSec" hidden>
    <div class="sec-title"><span class="dot"></span> جارية الآن <span class="count" id="liveCount"></span></div>
    <div class="rail" id="liveRail"></div>
  </section>
  <div id="leagues"></div>
  <div id="empty" hidden>لا توجد مباريات مطابقة لبحثك</div>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
let ALL = [], DAY = 'today', LEAGUE = 'all';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function workerBase(){
  try { return (localStorage.getItem('koora_worker') || '').trim(); } catch { return ''; }
}
/* match state helpers — same api/matches.js contract */
function isLive(m){
  const s = [m.official_status, m.status, m.game_time, m.result_text].join(' ');
  return /جارية|مباشر|الشوط|استراحة|1H|2H|HT|LIVE/i.test(s) ||
    (!!String(m.game_time || '').replace(/\D/g, '') && !isEnded(m));
}
function isEnded(m){
  const s = [m.official_status, m.status, m.result_text].join(' ');
  return /انتهت|نهاية|FT|Full/i.test(s);
}
function statusLabel(m){
  if (isLive(m)) return { cls: 'live', txt: m.game_time ? m.game_time.trim() + '’' : 'مباشر' };
  if (isEnded(m)) return { cls: '', txt: 'انتهت' };
  return { cls: '', txt: (m.time_text || '').trim() || '—' };
}
function playerLink(m){
  const q = new URLSearchParams({ id: m.id || '', href: m.href || '', home: m.home || '', away: m.away || '' });
  return 'player.html?' + q.toString();
}
function logoImg(src, alt){
  return `<img src="${src}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}

async function fetchData(day, silent){ // silent = background refresh: keep scroll + LEAGUE filter
  const wb = workerBase();
  const urls = [];
  if (wb) urls.push(wb.replace(/\/$/, '') + '/api/matches?day=' + day);
  urls.push('/api/matches?day=' + day, './matches.json');
  for (const u of urls){
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (Array.isArray(j) && j.length) return j;
    } catch {}
  }
  return null;
}

async function loadDay(day, silent){
  if (silent && document.hidden) return; // #2: no refresh while tab hidden
  DAY = day;
  if (!silent){
    $$('#dayTabs button').forEach(b => b.classList.toggle('on', b.dataset.day === day));
    $('#loading').hidden = false; $('#leagues').innerHTML = '';
    $('#liveSec').hidden = true; $('#empty').hidden = true;
  }
  const data = await fetchData(day, silent);
  $('#loading').hidden = true;
  if (!data){ if (!silent) toast('تعذّر تحميل المباريات — تحقق من الاتصال'); return; }
  ALL = data;
  if (!silent) buildChips();
  render();
}

setInterval(() => loadDay(DAY, true), 45000); // #2: silent score refresh every 45s

function buildChips(){
  const leagues = [...new Set(ALL.map(m => (m.league_text || m.league || '').trim()).filter(Boolean))];
  const box = $('#leagueChips');
  box.innerHTML = `<button class="chip${LEAGUE === 'all' ? ' on' : ''}" data-l="all">الكل</button>` +
    leagues.map(l => `<button class="chip${LEAGUE === l ? ' on' : ''}" data-l="${l}">${l}</button>`).join('');
  $$('.chip', box).forEach(c => c.onclick = () => {
    LEAGUE = c.dataset.l;
    $$('.chip', box).forEach(x => x.classList.toggle('on', x === c));
    render();
  });
}

function filtered(){
  const q = ($('#searchInput').value || '').trim();
  return ALL.filter(m => {
    if (LEAGUE !== 'all' && (m.league_text || m.league || '').trim() !== LEAGUE) return false;
    if (q && !((m.home || '') + ' ' + (m.away || '') + ' ' + (m.league_text || m.league || '')).includes(q)) return false;
    return true;
  });
}

function liveCard(m){
  const st = statusLabel(m);
  const score = (m.score_home !== '' && m.score_home != null) ? `${m.score_home} - ${m.score_away}` : 'VS';
  return `<a class="live-card" href="${playerLink(m)}">
    <div class="lg">${m.league_text || m.league || ''}</div>
    <div class="row">${logoImg(m.home_logo)}<span>${m.home || ''}</span></div>
    <div class="row" style="margin-top:6px">${logoImg(m.away_logo)}<span>${m.away || ''}</span></div>
    <div class="score-line"><span class="vs">${score}</span>
      <span class="minute"><span class="dot" style="background:#231a00"></span>${st.txt}</span></div>
  </a>`;
}

function rowCard(m){
  const st = statusLabel(m);
  const sh = (m.score_home !== '' && m.score_home != null) ? m.score_home : '';
  const sa = (m.score_away !== '' && m.score_away != null) ? m.score_away : '';
  return `<a class="m${isLive(m) ? ' is-live' : ''}" href="${playerLink(m)}">
    <div class="st"><div class="t">${(m.time_text || '').trim() || '–'}</div>
      <div class="s ${st.cls}">${st.txt}</div></div>
    <div class="teams">
      <div class="t">${logoImg(m.home_logo)}<span>${m.home || ''}</span><b>${sh}</b></div>
      <div class="t">${logoImg(m.away_logo)}<span>${m.away || ''}</span><b>${sa}</b></div>
    </div>
    <div class="go">‹</div>
  </a>`;
}

function render(){
  const list = filtered();
  const live = list.filter(isLive);
  const rest = list.filter(m => !isLive(m));
  $('#liveSec').hidden = !live.length;
  $('#liveRail').innerHTML = live.map(liveCard).join('');
  $('#liveCount').textContent = live.length || '';
  const groups = new Map();
  for (const m of rest){
    const k = (m.league_text || m.league || 'بطولات أخرى').trim();
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  }
  $('#leagues').innerHTML = [...groups].map(([lg, ms]) =>
    `<section class="league"><h3>${lg}</h3>${ms.map(rowCard).join('')}</section>`).join('');
  $('#empty').hidden = list.length > 0;
  injectJsonLd(list); // #9: fresh SportsEvent schema for crawlers
}

function injectJsonLd(list){ // #9: one SportsEvent per listed match
  document.getElementById('jsonld')?.remove();
  const graph = list.slice(0, 50).map(m => ({
    '@type': 'SportsEvent',
    name: `${m.home || ''} ضد ${m.away || ''}`,
    sport: 'كرة القدم',
    startDate: m.start || undefined,
    eventStatus: isLive(m)
      ? 'https://schema.org/EventLive'
      : (isEnded(m) ? 'https://schema.org/EventCompleted' : 'https://schema.org/EventScheduled'),
    homeTeam: { '@type': 'SportsTeam', name: m.home || '' },
    awayTeam: { '@type': 'SportsTeam', name: m.away || '' },
    url: playerLink(m)
  }));
  const s = document.createElement('script');
  s.type = 'application/ld+json'; s.id = 'jsonld';
  s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
  document.head.appendChild(s);
}

$('#searchInput').addEventListener('input', render);
$$('#dayTabs button').forEach(b => b.onclick = () => { LEAGUE = 'all'; loadDay(b.dataset.day); });
loadDay('today');

// #4: register service worker (ad-blocker + offline shell); no-op if unsupported
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
