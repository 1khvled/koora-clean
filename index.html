<style>
/* KOORA-OWN-v1: our own pitch-night design. No theme classes, no maroon. */
:root{
  --night:#071f19; --pitch:#0b3d2e; --grass:#16a34a;
  --paper:#f2f5f2; --card:#ffffff; --ink:#131a15; --muted:#5f6f65;
  --line:#e2e9e4; --live:#e0202e; --gold:#ffb800;
  --radius:16px; --shadow:0 1px 3px rgba(7,31,25,.10);
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
/* ── top bar ─────────────────────────────── */
.topbar{background:linear-gradient(160deg,var(--night),var(--pitch));
  color:#fff;padding:14px 16px calc(14px + 22px);position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;left:50%;top:-70px;width:220px;height:220px;
  border:2px solid rgba(255,255,255,.10);border-radius:50%;transform:translateX(-50%);
  pointer-events:none} /* center-circle motif */
.topbar::before{content:"";position:absolute;left:0;right:0;top:50px;height:2px;
  background:rgba(255,255,255,.07);pointer-events:none} /* halfway line */
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand .ball{width:42px;height:42px;border-radius:50%;background:var(--grass);
  display:grid;place-items:center;font-size:22px;flex:none}
.brand strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.brand small{display:block;color:#bfe3cf;font-size:12px;font-weight:600}
/* day segmented control — overlaps header bottom edge */
.days{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;
  margin:-22px 16px 0;position:relative;z-index:2;box-shadow:var(--shadow);
  border:1px solid var(--line)}
.days button{flex:1;border:0;background:transparent;font-family:var(--font);
  font-size:15px;font-weight:700;color:var(--muted);border-radius:10px;
  min-height:44px;cursor:pointer}
.days button.on{background:var(--pitch);color:#fff}
/* ── toolbar ─────────────────────────────── */
.toolbar{padding:12px 16px 0;display:grid;gap:10px}
#searchInput{width:100%;font-family:var(--font);font-size:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#searchInput:focus{outline:2px solid var(--grass);outline-offset:0;border-color:var(--grass)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:700;border-radius:999px;
  padding:8px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
/* ── content ─────────────────────────────── */
main{padding:12px 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:14px 2px 10px}
.sec-title .count{background:var(--live);color:#fff;font-size:12px;font-weight:800;
  border-radius:999px;padding:2px 10px}
/* live list — one calm vertical list instead of a swipe rail: every live
   match visible at a glance, same row component as the league groups. */
.live-list{display:grid;gap:8px;padding:2px 2px 8px}
.live-list .m.is-live{border-inline-start:4px solid var(--live)}
.live-lg{font-size:12px;font-weight:800;color:var(--pitch);margin:10px 2px 2px;
  display:flex;align-items:center;gap:8px}
.live-lg::after{content:"";flex:1;height:1px;background:var(--line)}
.live-lg:first-child{margin-top:0}
/* collapsed filler for hidden low-interest leagues (see HIDE_AR) */
.arab-more{margin-top:18px;border:1px dashed var(--line);border-radius:var(--radius);
  background:var(--card)}
.arab-more > summary{list-style:none;cursor:pointer;min-height:44px;display:flex;
  align-items:center;gap:8px;padding:12px 14px;font-size:13px;font-weight:800;
  color:var(--muted)}
.arab-more > summary::-webkit-details-marker{display:none}
.arab-more > summary .n{background:var(--line);border-radius:999px;padding:2px 10px;
  font-size:12px}
.arab-more .body{padding:0 8px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;
  animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* league groups */
.league{margin-top:18px}
.league > h3{font-size:14px;font-weight:800;color:var(--pitch);margin:0 2px 8px;
  display:flex;align-items:center;gap:8px}
.league > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.m{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;text-decoration:none;
  color:var(--ink);box-shadow:var(--shadow);min-height:64px}

.m .st .s{font-size:11px;font-weight:700;color:var(--muted)}
.m .st .s.live{color:var(--live)}
.m .teams{flex:1;display:grid;gap:6px;min-width:0}
.m .t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.m .t img{width:24px;height:24px;object-fit:contain;flex:none}
.m .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .t b{margin-inline-start:auto;font-weight:900;font-size:16px;flex:none}
.m .go{flex:none;color:var(--muted);font-size:18px}
.m.is-live{border-inline-start:4px solid var(--live)}
#empty{text-align:center;color:var(--muted);padding:40px 0;font-weight:600}
.loading{text-align:center;color:var(--muted);padding:40px 0;font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;
  font-size:14px;font-weight:600;border-radius:12px;padding:12px 18px;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;max-width:90vw;
  text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
/* tablets/desktops: wider content */
@media (min-width:768px){
  main{max-width:880px}
  .toolbar{max-width:880px;margin:0 auto;width:100%}
  .days{max-width:880px;margin-left:auto;margin-right:auto}
  .m{padding:14px 16px}
  .brand strong{font-size:22px}
}

    <div class="sec-title"><span class="dot"></span> جارية الآن <span class="count" id="liveCount"></span></div>
    <div class="live-list" id="liveRail"></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
let ALL = [], DAY = 'today', LEAGUE = 'all';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function workerBase(){
  try { return (localStorage.getItem('koora_worker') || '').trim(); } catch { return ''; }
}
/* match state helpers — same api/matches.js contract.
   Word-boundaried Latin codes (HT/LIVE/FT) so "Tonight"/"After" never match;
   game_time counts as live only when minute-like (digits, no clock colon). */
/* Wall-clock kickoff inference: upstream often sleeps 10-20min past kickoff
   (still NS at 15'). start+gameends are absolute ISO instants, so if NOW is
   inside the window the match IS live regardless of stale status fields.
   Only ever ADDS live — never overrides ended/upcoming. */
/* GOATED CLOCK v1 — fused live-minute estimator.
   Upstream can never know REAL minutes (stoppage, VAR, late kickoffs, long
   breaks), so two sources fuse by trust order:
     1. upstream minute (game_time/time_text) ANCHORED at fetch time, then
        ticked +1/min locally — stays alive between polls instead of freezing
        on a stale number (player page additionally anchors the FotMob exact
        minute, the truth when present);
     2. wall-clock map from start/gameends (45 play + 15 break + 45 play),
        half-aware with stoppage display (45+x' / 90+x').
   Inference only ever ADDS live — never overrides ended/upcoming. */
/* GOATED-CLOCK-START */
function parseMin(s){
  const t = String(s == null ? '' : s).trim();
  if (!t || t.indexOf(':') >= 0) return null; // clock time "19:30" — not a minute
  const m = t.match(/(\d{1,3})(?:\s*\+\s*(\d{1,2}))?/);
  if (!m) return null;
  if (t.indexOf("'") < 0 && t.indexOf('’') < 0 && t.length > 6) return null; // stray digits in prose
  const v = (+m[1]) + (+(m[2] || 0));
  return (v >= 1 && v <= 130) ? v : null;
}
function halfOf(o){
  const s = [o.official_status, o.status, o.game_time, o.result_text].join(' ');
  if (/استراح|بين الشوطين|\bHT\b/i.test(s)) return 'HT';
  if (/الثاني|\b2H\b/i.test(s)) return 2;
  if (/الشوط|\b1H\b/i.test(s)) return 1;
  return null;
}
function fmtMin(a){
  if (!a || a.min == null) return '';
  return a.plus > 0 ? (a.min + '+' + a.plus + '’') : (a.min + '’');
}
/* wall-clock map: raw elapsed -> match minute. Half-aware; stoppage shown as
   45+x' / 90+x'. 25' grace past gameends (VAR, long stoppage); null outside. */
function wallMap(o, now){
  try {
    if (!o || !o.start || !o.gameends) return null;
    const s = Date.parse(o.start), e = Date.parse(o.gameends);
    const n = now || Date.now();
    if (!isFinite(s) || !isFinite(e)) return null;
    if (n < s || n > e + 25 * 60000) return null;
    const el = Math.floor((n - s) / 60000);
    const half = halfOf(o);
    if (half === 'HT') return { brk: true };
    if (half === 1){
      if (el <= 45) return { min: Math.max(1, el), plus: 0 };
      if (el <= 58) return { min: 45, plus: Math.min(el - 45, 12) };
      return { brk: true }; // deep in the break with stale 1H status
    }
    if (half === 2){
      const b = el <= 60 ? 46 : el - 15;
      if (b <= 90) return { min: Math.max(46, b), plus: 0 };
      return { min: 90, plus: Math.min(b - 90, 20) };
    }
    if (el <= 44) return { min: Math.max(1, el), plus: 0 };
    if (el <= 47) return { min: 45, plus: el - 45 };
    if (el <= 60) return { brk: true };
    const b2 = el - 15;
    if (b2 <= 90) return { min: b2, plus: 0 };
    if (b2 <= 110) return { min: 90, plus: b2 - 90 };
    return null;
  } catch { return null; }
}
/* fused display minute: anchored upstream first (ticks between polls),
   wall map as fallback. Anchors (o._base at o._at) are stamped on data load. */
function showMinute(o, now){
  now = now || Date.now();
  const b = o ? o._base : null;
  if (b != null){
    const ticked = b + Math.floor((now - (o._at || now)) / 60000);
    if (ticked < 1 || ticked > 130) return wallMap(o, now);
    const h = halfOf(o);
    if ((h === 1 || h === 'HT') && ticked > 57) return h === 'HT' ? { brk: true } : { min: 45, plus: 12 };
    if (ticked > 90) return { min: 90, plus: Math.min(ticked - 90, 20) };
    return { min: ticked, plus: 0 };
  }
  return wallMap(o, now);
}
function liveMinute(m, now){
  const a = showMinute(m, now);
  return a && a.min != null ? a.min : null;
}
function isLive(m, now){
  if (!m || typeof m !== 'object') return false;
  if (isEnded(m)) return false; // ended first: stale windows never shadow FT
  const s = [m.official_status, m.status, m.game_time, m.result_text].join(' ');
  if (/جارية|مباشر|الشوط|استراحة/i.test(s)) return true;
  if (/\b(1H|2H|HT|LIVE)\b/i.test(s)) return true;
  const gt = String(m.game_time || '');
  if (!!gt.replace(/\D/g, '') && !/:/.test(gt)) return true;
  return wallMap(m, now || Date.now()) != null;
}
function isEnded(m){
  if (!m || typeof m !== 'object') return false;
  const s = [m.official_status, m.status, m.result_text].join(' ');
  return /انتهت|نهاية|\bFT\b|\bFull-?Time\b/i.test(s);
}
/* GOATED-CLOCK-END */
function statusLabel(m, now){
  // Decode first so `63&#039;` doesn't gain a second minute mark. When the
  // upstream minute is missing, the fused clock fills it in (anchored +
  // ticked, else wall map). Ended is checked first: a stale live window
  // must never shadow FT.
  if (isEnded(m)) return { cls: '', txt: 'انتهت' };
  if (isLive(m, now)){
    const a = showMinute(m, now);
    let t;
    if (a && a.min != null) t = fmtMin(a);
    else if (a && a.brk) t = 'استراحة';
    else t = 'مباشر';
    return { cls: 'live', txt: t };
  }
  return { cls: '', txt: dec(m.time_text || '').trim() || '—' };
}
/* Short player links: the old ?id=&href=&home=&… URLs ran 800+ chars
   (Arabic %-encoding x13 params). Now just ?m=<id>&d=<day> — the snapshot
   rides in sessionStorage (same-tab instant) + localStorage (12h TTL), with
   a matchday-API lookup as fallback. Legacy long URLs keep working. */
function cacheMatches(list, day){
  if (!list || !list.length) return;
  const at = Date.now();
  try {
    for (const m of list){
      if (!m || m.id == null) continue;
      const s = { id: String(m.id), href: m.href || '', home: m.home || '', away: m.away || '',
        hl: m.home_logo || '', al: m.away_logo || '', lg: m.league_text || m.league || '',
        tm: m.time_text || m.game_time || '', st: m.start || '', so: m.official_status || m.status || '',
        gt: m.game_time || '', sh: m.score_home ?? '', sa: m.score_away ?? '', ge: m.gameends || '',
        day: day || DAY, _at: at };
      const k = 'koora:m:' + s.id, v = JSON.stringify(s);
      try { sessionStorage.setItem(k, v); } catch {}
      try { localStorage.setItem(k, v); } catch {}
    }
  } catch {}
}
function playerLink(m){
  return 'player.html?m=' + encodeURIComponent(m.id || '') + '&d=' + encodeURIComponent(DAY);
}
/* SEC: every match field comes from a third-party scrape — escape before
   innerHTML or a compromised upstream owns the page (attr breakout + <img onerror>). */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/* Decode entities (single AND double-encoded) BEFORE esc() — otherwise
   upstream `&#039;` renders as literal garbage. Always use as esc(dec(x)). */
function dec(s){
  let out = String(s == null ? '' : s), prev = '';
  for (let i = 0; i < 3 && out !== prev; i++){
    prev = out;
    out = out.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
      .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => { const c = parseInt(h, 16); return c > 31 && c < 0x110000 ? String.fromCodePoint(c) : m; })
      .replace(/&#(\d+);/g, (m, n) => { const c = parseInt(n, 10); return c > 31 && c < 0x110000 ? String.fromCodePoint(c) : m; });
  }
  return out;
}
function tx(s){ return esc(dec(s)); }
function logoImg(src, alt){
  const u = dec(src);
  if (!u || !/^(https?:\/\/|\.\/|\/)/i.test(u)) return '';
  return `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}

let reqSeq = 0; // concurrency guard: stale day responses are ignored
async function fetchData(day, silent){ // silent = background refresh: keep scroll + LEAGUE filter
  const wb = workerBase();
  const urls = [];
  if (wb) urls.push(wb.replace(/\/$/, '') + '/api/matches?day=' + day);
  urls.push('/api/matches?day=' + day);
  if (day === 'today') urls.push('./matches.json'); // static fallback is today's data only
  for (const u of urls){
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (Array.isArray(j)) return j; // [] is a valid empty day, not a failure
    } catch {}
  }
  return null;
}

async function loadDay(day, silent){
  if (silent && document.hidden) return; // #2: no refresh while tab hidden
  const myReq = ++reqSeq;
  DAY = day;
  if (!silent){
    $$('#dayTabs button').forEach(b => {
      const on = b.dataset.day === day;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    $('#loading').hidden = false; $('#leagues').innerHTML = '';
    $('#liveSec').hidden = true; $('#empty').hidden = true;
  }
  const data = await fetchData(day, silent);
  if (myReq !== reqSeq) return; // a newer day request already won
  $('#loading').hidden = true;
  // Offline/failure: keep the stale list on screen, toast only when explicit.
  if (!data){ if (!silent) toast('تعذّر تحميل المباريات — تحقق من الاتصال'); return; }
  ALL = data.filter(x => x && typeof x === 'object');
  const fAt = Date.now();
  for (const m of ALL){ m._at = fAt; m._base = parseMin(m.game_time || m.time_text); }
  // Rebuild chips on silent too (new leagues appear mid-day); the LEAGUE
  // selection survives because it's matched by value, defaulting to 'all'
  // if the previously selected league vanished.
  if (LEAGUE !== 'all' && !ALL.some(m => (m.league_text || m.league || '').trim() === LEAGUE)) LEAGUE = 'all';
  buildChips();
  render(silent);
}

setInterval(() => loadDay(DAY, true), 45000); // #2: silent score refresh every 45s
setInterval(() => { // goated tick: advance displayed minutes between data polls (no fetch)
  if (document.hidden || !ALL.length) return;
  try { render(true); } catch {}
}, 30000);
// Catch-up refresh the moment the tab becomes visible again.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadDay(DAY, true);
});

/* League priority: Prem, La Liga, UCL always first and up — everything else
   keeps its natural order behind them. */
/* Arab-league filler: domestic leagues nobody watches collapse into one
   slim expandable row instead of spamming the page. Saudi football ALWAYS
   stays visible (ranked right after UCL). Search overrides the hiding. */
const HIDE_AR = /(المصري|مصر|المغربي|المغرب|الجزائري|الجزائر|التونسي|تونس|الإماراتي|الاماراتي|الإمارات|الامارات|القطري|قطر|الكويتي|الكويت|البحريني|البحرين|العماني|عمان|الأردني|الاردني|الأردن|الاردن|العراقي|العراق|السوري|سوريا|اللبناني|لبنان|الفلسطيني|فلسطين|اليمني|اليمن|الليبي|ليبيا|السوداني|السودان|الموريتاني|موريتانيا|\b(egypt\w*|morocc\w+|algeri\w+|tunisi\w+|emirati|qatar\w*|kuwait\w*|bahrain\w*|oman\w*|jordan\w*|iraq\w*|syri\w+|leban\w+|palest\w+|yemen\w*|liby\w+|sudan\w*|maurit\w+|djibouti|somal\w*|uae)\b)/i;
const SAUDI_RE = /سعود|روشن|saudi|ksa|roshn/i;
function leagueName(m){ return (m.league_text || m.league || '').trim(); }
function isHiddenLg(lg){
  const s = String(lg || '');
  if (!s) return false;
  if (SAUDI_RE.test(s)) return false; // KSA stays — everyone watches it
  return HIDE_AR.test(s);
}
function leagueRank(lg){
  const s = String(lg || '');
  if (/الإنجليز|premier|england/i.test(s)) return 0;
  if (/الإسبان|laliga|la liga/i.test(s)) return 1;
  if (/أبطال أوروبا|أبطال اوروبا|champions/i.test(s)) return 2;
  if (SAUDI_RE.test(s)) return 3;
  return 4;
}
const byLeague = (a, b) => leagueRank(a.league_text || a.league) - leagueRank(b.league_text || b.league);

let LEAGUE_LIST = []; // raw league names parallel to chip indexes (never in DOM)
function buildChips(){
  LEAGUE_LIST = [...new Set(ALL.map(m => (m.league_text || m.league || '').trim()).filter(Boolean).filter(l => !isHiddenLg(l)))]
    .sort((a, b) => leagueRank(a) - leagueRank(b));
  const box = $('#leagueChips');
  box.innerHTML = `<button class="chip${LEAGUE === 'all' ? ' on' : ''}" data-i="-1">الكل</button>` +
    LEAGUE_LIST.map((l, i) => `<button class="chip${LEAGUE === l ? ' on' : ''}" data-i="${i}">${tx(l)}</button>`).join('');
  $$('.chip', box).forEach(c => c.onclick = () => {
    const i = +c.dataset.i;
    LEAGUE = i < 0 ? 'all' : LEAGUE_LIST[i];
    $$('.chip', box).forEach(x => x.classList.toggle('on', x === c));
    try { c.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch {}
    render();
  });
}

function filtered(){
  const q = ($('#searchInput').value || '').trim().toLowerCase();
  return ALL.filter(m => {
    if (LEAGUE !== 'all' && (m.league_text || m.league || '').trim() !== LEAGUE) return false;
    if (q && !(((m.home || '') + ' ' + (m.away || '') + ' ' + (m.league_text || m.league || '')).toLowerCase().includes(q))) return false;
    return true;
  });
}

function rowCard(m){
  const st = statusLabel(m);
  const sh = (m.score_home !== '' && m.score_home != null) ? tx(m.score_home) : '';
  const sa = (m.score_away !== '' && m.score_away != null) ? tx(m.score_away) : '';
  const live = isLive(m);
  // Status column shows the minute for live matches (never stale "لم تبدأ").
  const top = live ? (st.txt === 'مباشر' ? '•' : st.txt) : (tx((m.time_text || '').trim()) || '–');
  return `<a class="m${live ? ' is-live' : ''}" href="${playerLink(m)}">
    <div class="st"><div class="t">${top}</div>
      <div class="s ${st.cls}">${tx(st.txt)}</div></div>
    <div class="teams">
      <div class="t">${logoImg(m.home_logo)}<span>${tx(m.home || '')}</span><b>${sh}</b></div>
      <div class="t">${logoImg(m.away_logo)}<span>${tx(m.away || '')}</span><b>${sa}</b></div>
    </div>
    <div class="go">‹</div>
  </a>`;
}

function render(silent){
  const rail = $('#liveRail');
  const list = filtered();
  cacheMatches(list, DAY);
  const q = ($('#searchInput').value || '').trim();
  const vis = m => q || !isHiddenLg(leagueName(m));
  const live = list.filter(m => vis(m) && isLive(m)).sort(byLeague);
  const rest = list.filter(m => !isLive(m));
  $('#liveSec').hidden = !live.length;
  // Live list with slim league dividers (Prem/LaLiga/UCL float to the top).
  let liveHtml = '', lastLg = null;
  for (const m of live){
    const lg = (m.league_text || m.league || '').trim() || 'بطولات أخرى';
    if (lg !== lastLg){ liveHtml += `<div class="live-lg">${tx(lg)}</div>`; lastLg = lg; }
    liveHtml += rowCard(m);
  }
  rail.innerHTML = liveHtml;
  $('#liveCount').textContent = live.length || '';
  const groups = new Map();
  for (const m of rest){
    if (!vis(m)) continue;
    const k = (m.league_text || m.league || '').trim() || 'بطولات أخرى';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  }
  let groupsHtml = [...groups].map(([lg, ms]) => ({ lg, ms, r: leagueRank(lg) }))
    .sort((a, b) => a.r - b.r)
    .map(({ lg, ms }) =>
      `<section class="league"><h3>${tx(lg)}</h3>${ms.map(rowCard).join('')}</section>`).join('');
  const hid = list.filter(m => !vis(m));
  if (hid.length){
    const hn = hid.filter(isLive).length;
    groupsHtml += `<details class="arab-more"><summary>${hn ? '<span class="dot"></span>' : ''}دوريات عربية أخرى — مخفية <span class="n">${hid.length}</span></summary><div class="body">${hid.map(rowCard).join('')}</div></details>`;
  }
  $('#leagues').innerHTML = groupsHtml;
  // #empty is for "filter matched nothing" — offline keeps the stale list
  // with a toast instead (loadDay returns early on !data).
  $('#empty').hidden = list.length > 0 || ALL.length === 0;
  // SEO schema is for crawlers, not humans: rebuild at most every ~4min,
  // not on every 45s silent render (JSON churn + layout cost for nothing).
  render._n = (render._n || 0) + 1;
  if (!silent || render._n % 6 === 1) injectJsonLd(list); // #9
}

function injectJsonLd(list){ // #9: one SportsEvent per listed match
  document.getElementById('jsonld')?.remove();
  const isoStart = (m) => {
    const s = String(m.start || '');
    return /^(19|20)\d\d-\d\d-\d\dT\d\d:\d\d/.test(s) ? s : undefined;
  };
  const graph = list.slice(0, 50).map(m => ({
    '@type': 'SportsEvent',
    name: `${m.home || ''} ضد ${m.away || ''}`,
    sport: 'كرة القدم',
    startDate: isoStart(m),
    eventStatus: isLive(m)
      ? 'https://schema.org/EventLive'
      : (isEnded(m) ? 'https://schema.org/EventCompleted' : 'https://schema.org/EventScheduled'),
    homeTeam: { '@type': 'SportsTeam', name: m.home || '' },
    awayTeam: { '@type': 'SportsTeam', name: m.away || '' },
    url: new URL(playerLink(m), location.href).toString()
  }));
  const s = document.createElement('script');
  s.type = 'application/ld+json'; s.id = 'jsonld';
  s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
  document.head.appendChild(s);
}

let searchT = null;
$('#searchInput').addEventListener('input', () => { // debounced: no DOM churn per keystroke
  clearTimeout(searchT);
  searchT = setTimeout(render, 160);
});
$$('#dayTabs button').forEach(b => b.onclick = () => { LEAGUE = 'all'; loadDay(b.dataset.day); });
document.querySelector('#dayTabs')?.setAttribute('role', 'tablist');
$$('#dayTabs button').forEach(b => { b.setAttribute('role', 'tab'); if (!b.hasAttribute('aria-selected')) b.setAttribute('aria-selected', b.classList.contains('on') ? 'true' : 'false'); });
loadDay('today');

// #4: register service worker (ad-blocker + offline shell); no-op if unsupported
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
