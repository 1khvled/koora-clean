name: telegram-news-bridge

on:
  schedule:
    # every 5 minutes (cron-job.org also dispatches as backup -- see TG_SETUP.md)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install telethon requests
      - name: Run news bridge
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          MYMEMORY_KEY: ${{ secrets.MYMEMORY_KEY }}
        run: python scripts/tg_news.py
      - name: Save dedup state
        run: |
          git config user.name "khvled"
          git config user.email "khvled2004@gmail.com"
          git add scripts/tg_state.json
          if ! git diff --cached --quiet; then
            git commit -m "news bridge state [skip ci]"
            git push
          fi
