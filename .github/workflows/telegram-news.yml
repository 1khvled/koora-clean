name: telegram-news-bridge

on:
  schedule:
    # Post pace is STILL every 5 minutes. (timeout-minutes: 30 below is only
    # the safety cap for one run, not the posting frequency.) The Night
    # throttle step makes 03:00-10:00 Algiers run :00/:30 only (30-min).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Night throttle (03-10 Algiers runs :00/:30 only)
        id: throttle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H="$(TZ=Africa/Algiers date +%H)"
          M="$(TZ=Africa/Algiers date +%M)"
          # (10# forces base-10: 08/09 are invalid octal and would choke test.)
          if [ "$((10#$H))" -ge 3 ] && [ "$((10#$H))" -lt 10 ]; then
            if [ "$((10#$M % 30))" -ne 0 ]; then
              echo "night throttle: $H:$M Algiers quiet slot, skipping posts"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: steps.throttle.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - name: Install ffmpeg (only used to shrink >50MB clips)
        if: steps.throttle.outputs.skip != 'true'
        # ffmpeg is preinstalled on github-hosted runners; apt only as a
        # bounded fallback so a stalled mirror download can never eat the
        # job budget again.
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version 2>/dev/null | head -n1)"
          else
            timeout 120 sudo apt-get install -y ffmpeg || echo "ffmpeg unavailable; oversized clips will be sent without compression"
          fi
      - name: Install deps
        if: steps.throttle.outputs.skip != 'true'
        run: pip install telethon requests pillow
      - name: Load dedup state (state branch keeps Vercel quiet)
        run: |
          git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
          if git rev-parse --verify origin/state >/dev/null 2>&1; then
            git show origin/state:scripts/tg_state.json > scripts/tg_state.json
            echo "state seeded from origin/state"
          else
            echo "no state branch yet, using main checkout copy"
          fi
      - name: Run news bridge
        if: steps.throttle.outputs.skip != 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          MYMEMORY_KEY: ${{ secrets.MYMEMORY_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/tg_news.py
      - name: Kooradz promos (kickoffs + heartbeat)
        if: steps.throttle.outputs.skip != 'true'
        # Promo failures must never block Save dedup state below.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: python scripts/tg_promo.py
      - name: Channel SEO (about text + pinned keywords)
        if: steps.throttle.outputs.skip != 'true'
        # SEO failures must never block Save dedup state below.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: python scripts/tg_seo.py
      - name: Save dedup state (state branch only — main pushes redeploy Vercel)
        run: |
          git config user.name "khvled"
          git config user.email "khvled2004@gmail.com"
          SAVED=0
          for i in 1 2 3 4 5; do
            git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
          python3 - <<'EOF'
          import json, subprocess
          def load(cmd):
              try:
                  out = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  d = json.loads(out.stdout)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}
          # local = the working-tree file the bridge just wrote (NOT the index:
          # git add has not run yet, so ':file' is still the stale checkout)
          local = {}
          try:
              with open('scripts/tg_state.json', encoding='utf-8') as f:
                  local = json.load(f)
              if not isinstance(local, dict):
                  local = {}
          except Exception:
              local = {}
          remote = load(['git', 'show', 'origin/state:scripts/tg_state.json'])
          merged = dict(remote)
          for k, v in local.items():
              if isinstance(v, dict) or isinstance(merged.get(k), dict):
                  # dicts (source->channel id map, retry counters)
                  # union per key, local wins ties; bound the id map.
                  a = merged.get(k) or {}
                  b = v or {}
                  if not isinstance(a, dict):
                      a = {}
                  if not isinstance(b, dict):
                      b = {}
                  u = dict(a)
                  u.update(b)
                  if len(u) > 200:
                      u = dict(list(u.items())[-200:])
                  merged[k] = u
              elif isinstance(v, list) or isinstance(merged.get(k), list):
                  # lists (the 'seen' fingerprints) union, newest wins
                  a = merged.get(k) or []
                  b = v or []
                  seen = []
                  for x in list(a) + list(b):
                      if x not in seen:
                          seen.append(x)
                  merged[k] = seen[-300:]
              else:
                  try:
                      if int(v or 0) > int(merged.get(k) or 0):
                          merged[k] = v
                  except Exception:
                      merged[k] = v
          with open('scripts/tg_state.json', 'w', encoding='utf-8') as f:
              json.dump(merged, f, ensure_ascii=False, indent=1)
          EOF
            # Carry the heartbeat file forward too so this push never drops it.
            git show origin/state:.github/heartbeat.txt > .github/heartbeat.txt.tmp 2>/dev/null && mv .github/heartbeat.txt.tmp .github/heartbeat.txt || rm -f .github/heartbeat.txt.tmp
            git add scripts/tg_state.json
            [ -f .github/heartbeat.txt ] && git add .github/heartbeat.txt
            if git diff --cached --quiet; then
              echo "state unchanged, nothing to push"
              exit 0
            fi
            if git rev-parse --verify origin/state >/dev/null 2>&1; then
              PARENT=origin/state
            else
              PARENT=HEAD
            fi
            TREE=$(git write-tree) || { sleep 15; continue; }
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "news bridge state [skip ci]") || { sleep 15; continue; }
            # Fully-qualified ref: pushing a raw SHA to a not-yet-existing
            # branch is rejected without it.
            if git push origin "$COMMIT:refs/heads/state"; then
              SAVED=1
              break
            fi
            sleep 15
          done
          # A green run must mean the state was persisted (or there was
          # nothing to persist -- that path exits 0 inside the loop).
          if [ "$SAVED" -ne 1 ]; then
            echo "dedup state push failed after 5 attempts"
            exit 1
          fi
      - name: Alert owner on failure (Telegram DM)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHAT_ID="5625295907"
          # Exported so the payload builder below can read it from the
          # environment (an inline CHAT=... prefix only reaches printf).
          export CHAT="$CHAT_ID"
          UTC_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Best-effort failed-step lookup; never fails this step.
          FAILED="unknown (open run URL, failed step is highlighted)"
          if command -v gh >/dev/null 2>&1; then
            LOOKUP="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate -q '[.jobs[] | select(.conclusion == "failure") | "\(.name): " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | join(" | ")' 2>/dev/null || true)"
            if [ -n "${LOOKUP:-}" ]; then
              FAILED="$(printf '%s' "$LOOKUP" | head -c 800)"
            fi
          fi
          TEXT="$(printf 'Workflow FAILED: %s\nRun #%s (id %s)\nJob: %s | conclusion: %s\nFailed step(s): %s\nTime (UTC): %s\n%s' \
            "${{ github.workflow }}" "${{ github.run_number }}" "${{ github.run_id }}" \
            "${{ github.job }}" "${{ job.status }}" "$FAILED" "$UTC_NOW" "$RUN_URL")"
          PAYLOAD="$(printf '%s' "$TEXT" | python3 -c 'import json,sys,os; print(json.dumps({"chat_id": os.environ["CHAT"], "text": sys.stdin.read(), "disable_web_page_preview": True}))')"
          # Single send, silent, never fails the workflow, token stays in env (masked by GitHub, never echoed).
          curl -sS --max-time 20 -H 'Content-Type: application/json' -d "$PAYLOAD" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null || true
          exit 0
