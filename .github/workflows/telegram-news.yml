name: telegram-news-bridge

on:
  schedule:
    # every 5 minutes (cron-job.org also dispatches as backup -- see TG_SETUP.md)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg (only used to shrink >50MB clips)
        run: sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install telethon requests pillow
      - name: Run news bridge
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          MYMEMORY_KEY: ${{ secrets.MYMEMORY_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/tg_news.py
      - name: Kooradz promos (kickoffs + heartbeat)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: python scripts/tg_promo.py
      - name: Channel SEO (about text + pinned keywords)
        run: python scripts/tg_seo.py
      - name: Save dedup state
        run: |
          git config user.name "khvled"
          git config user.email "khvled2004@gmail.com"
          git fetch --depth=20 origin main || true
          python3 - <<'EOF'
          import json, subprocess
          def load(cmd):
              try:
                  out = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  d = json.loads(out.stdout)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}
          # local = the working-tree file the bridge just wrote (NOT the index:
          # git add has not run yet, so ':file' is still the stale checkout)
          local = {}
          try:
              with open('scripts/tg_state.json', encoding='utf-8') as f:
                  local = json.load(f)
              if not isinstance(local, dict):
                  local = {}
          except Exception:
              local = {}
          remote = load(['git', 'show', 'origin/main:scripts/tg_state.json'])
          merged = dict(remote)
          for k, v in local.items():
              if isinstance(v, list) or isinstance(merged.get(k), list):
                  # lists (the 'seen' fingerprints) union, newest wins
                  a = merged.get(k) or []
                  b = v or []
                  seen = []
                  for x in list(a) + list(b):
                      if x not in seen:
                          seen.append(x)
                  merged[k] = seen[-300:]
              else:
                  try:
                      if int(v or 0) > int(merged.get(k) or 0):
                          merged[k] = v
                  except Exception:
                      merged[k] = v
          with open('scripts/tg_state.json', 'w', encoding='utf-8') as f:
              json.dump(merged, f, ensure_ascii=False, indent=1)
          EOF
          git add scripts/tg_state.json
          if ! git diff --cached --quiet; then
            git commit -m "news bridge state [skip ci]"
            for i in 1 2 3 4 5; do
              git rebase origin/main && git push && break
              sleep 15
            done
          fi
