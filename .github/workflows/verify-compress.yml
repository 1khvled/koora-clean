name: verify-compress
# TEMPORARY: proves the oversized-clip path on the real runner, then is deleted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install telethon
      - name: Show ffmpeg
        run: |
          which ffmpeg && ffmpeg -version 2>&1 | head -1
          ffprobe -version 2>&1 | head -1
      - name: Compress the real 75MB clip
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python - <<'EOF'
          import os, subprocess, sys, json
          sys.path.insert(0, 'scripts')
          import tg_news as tg
          from telethon.sessions import StringSession
          from telethon.sync import TelegramClient
          MID = int(os.environ.get('MID', '375812'))
          cl = TelegramClient(StringSession(os.environ['TG_SESSION']),
                              int(os.environ['TG_API_ID']),
                              os.environ['TG_API_HASH'])
          cl.connect()
          m = cl.get_messages('Offsideahdaff', ids=MID)
          print('SOURCE size=%d mime=%s' % (m.document.size, m.document.mime_type))
          raw = cl.download_media(m, bytes)
          print('DOWNLOADED %d bytes' % len(raw))
          open('/tmp/orig.mp4', 'wb').write(raw)
          def probe(p):
              r = subprocess.run(['ffprobe', '-v', 'error', '-select_streams',
                                  'v:0', '-show_entries',
                                  'stream=width,height,duration,bit_rate',
                                  '-of', 'json', p],
                                 capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)['streams'][0]
              except Exception:
                  return {}
          print('ORIGINAL probe=%s' % probe('/tmp/orig.mp4'))
          out, crf = tg.compress_video(raw, 48000000)
          print('RESULT crf=%s bytes=%s' % (crf, len(out) if out else None))
          if out:
              open('/tmp/small.mp4', 'wb').write(out)
              print('COMPRESSED probe=%s' % probe('/tmp/small.mp4'))
              print('RATIO %.1f%% of original' % (100.0 * len(out) / len(raw)))
              print('UNDER_CAP %s' % (len(out) <= 48000000))
          else:
              print('UNDER_CAP False (would fall back to the frame)')
          cl.disconnect()
          EOF