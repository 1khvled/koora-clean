name: keepalive

# GitHub auto-disables scheduled workflows after 60 days with zero repo
# activity. The news bridge commits state on every run, but a quiet news
# stretch could still trip the 60-day rule — this weekly heartbeat keeps
# every schedule (news bridge included) alive forever.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "khvled"
          git config user.email "khvled2004@gmail.com"
          for i in 1 2 3 4 5; do
            git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
            # Carry the live state file forward: this flow never modifies it,
            # and must not drop it from the branch.
            git show origin/state:scripts/tg_state.json > scripts/tg_state.json.tmp 2>/dev/null && mv scripts/tg_state.json.tmp scripts/tg_state.json || rm -f scripts/tg_state.json.tmp
            git add .github/heartbeat.txt
            [ -f scripts/tg_state.json ] && git add scripts/tg_state.json
            if git diff --cached --quiet; then
              echo "heartbeat unchanged"
              exit 0
            fi
            if git rev-parse --verify origin/state >/dev/null 2>&1; then
              PARENT=origin/state
            else
              PARENT=HEAD
            fi
            TREE=$(git write-tree) || { sleep 15; continue; }
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "keepalive ping [skip ci]") || { sleep 15; continue; }
            git push origin "$COMMIT:refs/heads/state" && break
            sleep 15
          done
