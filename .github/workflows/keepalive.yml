name: keepalive

# GitHub auto-disables scheduled workflows after 60 days with zero repo
# activity. The news bridge commits state on every run, but a quiet news
# stretch could still trip the 60-day rule — this weekly heartbeat keeps
# every schedule (news bridge included) alive forever.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "khvled"
          git config user.email "khvled2004@gmail.com"
          git fetch --depth=20 origin main || true
          python3 - <<'EOF'
          import json, subprocess
          def load(cmd):
              try:
                  out = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  d = json.loads(out.stdout)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}
          local = load(['git', 'show', ':scripts/tg_state.json'])
          remote = load(['git', 'show', 'origin/main:scripts/tg_state.json'])
          merged = dict(remote)
          for k, v in local.items():
              try:
                  if int(v or 0) > int(merged.get(k) or 0):
                      merged[k] = v
              except Exception:
                  merged[k] = v
          with open('scripts/tg_state.json', 'w', encoding='utf-8') as f:
              json.dump(merged, f, ensure_ascii=False, indent=1)
          EOF
          git add .github/heartbeat.txt
          if ! git diff --cached --quiet; then
            git commit -m "keepalive ping [skip ci]"
            for i in 1 2 3 4 5; do
              git rebase origin/main && git push && break
              sleep 15
            done
          fi
